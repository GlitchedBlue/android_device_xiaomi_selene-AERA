name: Build AERA Recovery (selene)

# The compile runs on Crave's servers. This workflow only drives the Crave
# CLI, so it fits comfortably on a stock ubuntu-latest runner (no 300 GB disk
# needed locally) - the only thing uploaded is a small shell script.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Crave project ID to run the job on (see the "List Crave projects" step)'
        required: false
        default: ''
      clean:
        description: 'Wipe the workspace and do a full sync'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - aera-16.0
    paths:
      - '.github/workflows/crave-selene.yml'
      - 'scripts/crave-build.sh'
      - 'device/**'

# The build job ships its GITHUB_TOKEN to Crave, and Crave prints it in the
# job's "Build Commands" panel, which the whole team can read. Keep that token
# read-only: the only thing the remote node needs it for is cloning this
# private device tree. Publishing happens in a second job that never leaves
# GitHub.
permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build on Crave
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CRAVE_PROJECT_ID: ${{ github.event.inputs.project_id || vars.CRAVE_PROJECT_ID || '99' }}
      CLEAN: ${{ github.event.inputs.clean == 'true' && '1' || '0' }}
      GH_REPO: ${{ github.repository }}
      GH_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Check out the device tree
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Crave CLI
      # ---------------------------------------------------------------------
      # The config is written first so that `crave version` is probed with
      # credentials available; some releases crash before reading a config.
      - name: Write crave.conf
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CRAVE_USERNAME:-}" ] || [ -z "${CRAVE_TOKEN:-}" ]; then
            echo "::error::CRAVE_USERNAME / CRAVE_TOKEN secrets are not set"
            exit 1
          fi
          cat > "$HOME/crave.conf" <<EOF
          {
            "username": "${CRAVE_USERNAME}",
            "headers": {
              "Content-Type": "application/json",
              "Authorization": "${CRAVE_TOKEN}",
              "User-Agent": "Crave"
            },
            "projects": [],
            "server": "https://foss.crave.io/api"
          }
          EOF
          python3 -c 'import json,sys; json.load(open(sys.argv[1])); print("crave.conf is valid JSON")' "$HOME/crave.conf"

      - name: Install the Crave CLI
        env:
          CRAVE_VERSION: ${{ vars.CRAVE_VERSION }}
        run: |
          set -uo pipefail
          mkdir -p "$HOME/bin"

          # 0.2-7237 (the current "latest") aborts every subcommand with
          #   Caught unknown error: 'Namespace' object has no attribute 'amsfeaturecap'
          # so probe a few releases and keep the first one that actually runs.
          CANDIDATES="${CRAVE_VERSION:-} 0.2-7237 0.2-7226 0.2-7220 0.2-7210 0.2-7193 0.2-7183"
          WORKING=""
          for V in $CANDIDATES; do
            [ -n "$V" ] || continue
            URL="https://github.com/accupara/crave/releases/download/${V}/crave-${V}-linux-amd64.bin"
            echo "--- trying crave ${V}"
            if ! curl -fsSL "$URL" -o "$HOME/bin/crave"; then
              echo "    download failed"
              continue
            fi
            chmod +x "$HOME/bin/crave"
            if [ "$(head -c 4 "$HOME/bin/crave" | od -An -tx1 | tr -d ' \n')" != "7f454c46" ]; then
              echo "    not an ELF binary"
              continue
            fi
            OUT="$("$HOME/bin/crave" version 2>&1)"
            RC=$?
            echo "    exit=${RC}"
            echo "    output=${OUT}"
            if [ "$RC" -eq 0 ]; then
              WORKING="$V"
              break
            fi
          done

          if [ -z "$WORKING" ]; then
            echo "::error::no Crave release could be started on this runner"
            exit 1
          fi

          echo "Using crave ${WORKING}"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: List Crave projects
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout 120 crave -n list || true

      # ---------------------------------------------------------------------
      # Crave workspace
      # ---------------------------------------------------------------------
      # `crave run` works out which project a directory belongs to from the
      # local .repo manifest, so a shallow `repo init` of the base project's
      # manifest is required. Nothing is synced here - the build node does the
      # real sync.
      - name: Prepare the Crave workspace
        env:
          BASE_MANIFEST: ${{ vars.CRAVE_BASE_MANIFEST || 'https://github.com/accupara/los23.2.git' }}
          BASE_BRANCH: ${{ vars.CRAVE_BASE_BRANCH || 'lineage-23.2' }}
        run: |
          set -uo pipefail
          WS="${HOME}/crave-ws"
          echo "CRAVE_WS=${WS}" >> "$GITHUB_ENV"
          mkdir -p "$WS" "$HOME/bin"

          if ! command -v repo >/dev/null 2>&1; then
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
            chmod +x "$HOME/bin/repo"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi

          git config --global user.name "AERA Builder"
          git config --global user.email "builder@localhost"
          git config --global --add safe.directory '*'

          cd "$WS"
          echo "repo init -u ${BASE_MANIFEST} -b ${BASE_BRANCH}"
          repo init -u "${BASE_MANIFEST}" -b "${BASE_BRANCH}" --depth=1 --no-repo-verify
          ls -a "$WS" | head -20

      # ---------------------------------------------------------------------
      # Remote build
      # ---------------------------------------------------------------------
      # A cancelled workflow leaves its Crave job queued or running on the
      # server, and Crave only allows one job per workspace. Clear the way
      # before starting a new one.
      - name: Stop any job left on the workspace
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "${CRAVE_WS}" 2>/dev/null || exit 0
          timeout 120 crave -n stop --all --force || true

      - name: Build on Crave
        env:
          # Read-only (see `permissions:` above) and short-lived: it dies with
          # this job. The node uses it only to clone the private device tree.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          set -uo pipefail
          cd "${CRAVE_WS}"
          SCRIPT_B64="$(base64 -w0 "${GITHUB_WORKSPACE}/scripts/crave-build.sh")"
          CLEAN_FLAG=""
          if [ "${CLEAN}" = "1" ]; then CLEAN_FLAG="--clean"; fi
          echo "Starting Crave job on project ${CRAVE_PROJECT_ID}"
          echo "Watch it at https://foss.crave.io/app/#/build"
          crave -n run \
            --projectID "${CRAVE_PROJECT_ID}" \
            --no-artifacts \
            --no-patch \
            ${CLEAN_FLAG} \
            --message "AERA selene ${GITHUB_RUN_ID}" \
            -- "GH_TOKEN='${GH_TOKEN:-}' GH_REPO='${GH_REPO}' GH_BRANCH='${GH_BRANCH}' bash -c 'echo ${SCRIPT_B64} | base64 -d | bash'"

      # ---------------------------------------------------------------------
      # Collect the images
      # ---------------------------------------------------------------------
      # The workspace on this runner carries the same path and hostname that
      # the Crave job used, so `crave pull` fetches what the build left in
      # crave-artifacts/. It is retried because the workspace can take a
      # moment to settle after the job exits.
      - name: Pull the built images
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "${CRAVE_WS}" 2>/dev/null || exit 0
          for attempt in 1 2 3; do
            echo "--- crave pull (attempt ${attempt})"
            timeout 300 crave -n pull crave-artifacts && break
            sleep 20
          done
          ls -lhR crave-artifacts 2>/dev/null || echo "nothing was pulled"

      - name: Upload the boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-selene-${{ github.run_id }}
          path: crave-artifacts/**
          if-no-files-found: warn
          retention-days: 30

      - name: Show the Crave log on failure
        if: failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "${CRAVE_WS}" 2>/dev/null || exit 0
          timeout 120 crave -n getlog || true

  # ---------------------------------------------------------------------------
  # Publish
  # ---------------------------------------------------------------------------
  # Releases are created here rather than on the build node: this job has a
  # write-scoped token, and that token never leaves GitHub.
  publish:
    name: Publish the release
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download the built images
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: AERA-selene-${{ github.run_id }}
          path: images

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: aera-selene-${{ github.run_id }}
        run: |
          set -uo pipefail
          mapfile -t IMAGES < <(find images -type f -name '*.img' 2>/dev/null)
          if [ "${#IMAGES[@]}" -eq 0 ]; then
            echo "::warning::no images were collected - nothing to publish"
            exit 0
          fi
          printf 'asset: %s\n' "${IMAGES[@]}"

          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --title "AERA selene ${GITHUB_RUN_ID}" \
              --notes "Automatic AERA Recovery (selene) build from GitHub Actions run ${GITHUB_RUN_ID}." \
              --prerelease
          fi

          gh release upload "$TAG" "${IMAGES[@]}" --repo "$GH_REPO" --clobber
          echo "published https://github.com/${GH_REPO}/releases/tag/${TAG}"
