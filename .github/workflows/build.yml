name: Build AERA Recovery for selene

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Setup Crave CLI
        run: |
          # Completely clear any old, broken cached tools from the environment
          rm -rf ${HOME}/bin
          mkdir -p ${HOME}/bin
          
          # Use the official Crave setup pipeline utility
          curl -s https://githubusercontent.com | bash -s --
          
          # The official installer puts the working binary right in your folder root
          if [ -f crave ]; then
            mv crave ${HOME}/bin/
          fi
          
          chmod +x ${HOME}/bin/crave
          echo "${HOME}/bin" >> $GITHUB_PATH

      - name: Authenticate Crave
        run: |
          mkdir -p ${HOME}/.crave
          cat <<EOF > ${HOME}/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}",
            "project": "aera-recovery-selene"
          }
          EOF

      - name: Initialize Crave Workspace
        run: |
          crave clone create --project aera-recovery-selene || true

      - name: Setup Manifest
        run: |
          crave run -- "mkdir -p .repo/local_manifests"
          curl -sL https://githubusercontent.com | crave run -- "cat > .repo/local_manifests/aera.xml"

      - name: Sync and Compile
        run: |
          crave run -- "repo sync -c -j\$(nproc --all) --force-sync --no-clone-bundle --no-tags && chmod +x device/xiaomi/selene/build-aera-selene.sh && ./device/xiaomi/selene/build-aera-selene.sh"

      - name: Pull Image
        run: |
          crave pull out/target/product/selene/AERA-R1.0-Alpha-Unofficial-selene.img || crave pull out/target/product/selene/AERA-*.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AERA-selene
          path: AERA-*.img
