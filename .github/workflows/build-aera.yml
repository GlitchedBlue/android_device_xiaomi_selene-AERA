name: Build AERA Recovery (selene)

# AERA for the Xiaomi Redmi 10 (selene), compiled on a GitHub-hosted runner.
#
# Runner recipe is the one that actually ships AERA images (AzzyC's
# Action-OFRP-Builder, 14/20 successes at 78-156 min on the same manifest):
#
#   * ubuntu-24.04 -- NOT 22.04. The 24.04 public image comes with a 145 GB
#     root disk. On 22.04 easimon/maximize-build-space pooled us down to 84 GB,
#     i.e. it was actively costing us space. Do not add it back.
#   * slimhub deletes the preinstalled SDKs/CLR/Haskell/CodeQL that this build
#     never touches.
#   * 30 GB of swap is what lets -j$(nproc) survive Soong's peak RSS on a
#     16 GB runner.
#
# The repository MUST be public. A private repo gets a 2 vCPU / 8 GB runner and
# Soong is OOM-killed about 48 minutes in. Every AERA builder repo that produces
# images is public for exactly this reason.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        type: choice
        default: bootimage
        options:
          - bootimage
          - recoveryimage
          - vendorboot
      device_branch:
        description: 'Device tree branch'
        required: false
        default: aera-16.0
  push:
    branches:
      - aera-16.0
    paths:
      - 'device/**'
      - '.github/workflows/build-aera.yml'

concurrency:
  group: aera-selene
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build AERA for selene
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      AERA_MANIFEST: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: aera-16.0
      DEVICE: selene
      DEVICE_PATH: device/xiaomi/selene
      LUNCH: twrp_selene-bp2a-eng
      BUILD_TARGET: ${{ github.event.inputs.target || 'bootimage' }}
      DEVICE_BRANCH: ${{ github.event.inputs.device_branch || 'aera-16.0' }}
      WORKDIR: ${{ github.workspace }}/aera

    steps:
      # ---------------------------------------------------------------------
      # Space / RAM
      # ---------------------------------------------------------------------
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 30

      - name: Show resources
        run: |
          echo "cores: $(nproc)"
          df -h /
          free -h

      # ---------------------------------------------------------------------
      # Toolchain
      # ---------------------------------------------------------------------
      # OrangeFox's android_build_env.sh is the de-facto standard, but on noble
      # it is effectively a no-op (it only pulls software-properties-common) --
      # the ubuntu-24.04 image already carries most of the Android toolchain.
      # The extras below are therefore filtered by availability: Ubuntu 24.04
      # dropped the 22.04-era names (libncurses5, lib32ncurses5-dev do not
      # exist on noble) and one unknown name aborts the whole apt transaction.
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y

          if curl -fsSL -o /tmp/android_build_env.sh \
               "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"; then
            sudo bash /tmp/android_build_env.sh || true
          fi

          WANTED="git-core gnupg flex bison build-essential zip curl zlib1g-dev \
                  libc6-dev-i386 libncurses-dev lib32ncurses-dev libncurses5 \
                  lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
                  libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
                  python3 python-is-python3 rsync lz4 bc ccache imagemagick libssl-dev \
                  cpio xz-utils"
          AVAILABLE=""
          for pkg in $WANTED; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              AVAILABLE="$AVAILABLE $pkg"
            else
              echo "skipping (not packaged here): $pkg"
            fi
          done
          sudo apt-get install -y $AVAILABLE

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          repo --version

          git config --global user.name "AERA Builder"
          git config --global user.email "builder@github.local"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      # ---------------------------------------------------------------------
      # Source
      # ---------------------------------------------------------------------
      # The AERA manifest is ~1000 projects. Sync is the fragile part: a dead
      # remote used to hang forever on a credential prompt, and a killed
      # attempt leaves packfiles behind, so the resume loop can itself bloat
      # .repo. Hence: fail fast on prompts, a 45 minute cap per attempt, a
      # heartbeat so the runner never goes silent for an hour, and a free
      # space guard that fails loudly instead of burning half an hour.
      #
      # The .repo cache is worth ~12 minutes per attempt. Measured on
      # ILYESwsa's F11 workflow (same manifest, same runner class):
      #   restore 18.8 GB cache   3m39s
      #   repo sync after restore  3m46s
      #   total                     ~7m30s   (vs ~20m cold)
      # It is an 18.8 GB entry, well over the 10 GB free-tier figure -- it
      # restores fine in practice, so do not "fix" it by trimming the path.
      - name: Restore source cache
        id: synccache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: aera/.repo
          key: aera-sync-${{ env.MANIFEST_BRANCH }}-v1

      - name: Sync AERA sources
        run: |
          mkdir -p "${WORKDIR}"
          cd "${WORKDIR}"

          repo init --depth=1 -u "${AERA_MANIFEST}" -b "${MANIFEST_BRANCH}"
          find .repo/manifests -name '*.xml' -exec sed -i 's|ssh://git@github.com/|https://github.com/|g' {} + || true

          export GIT_TERMINAL_PROMPT=0
          OK=0
          for attempt in 1 2 3; do
            FREE_GB=$(df --output=avail -BG . | tail -1 | tr -dc '0-9')
            echo "--- sync attempt ${attempt}: ${FREE_GB}G free"
            if [ "${FREE_GB}" -lt 15 ]; then
              echo "ERROR: only ${FREE_GB}G free at attempt start"
              exit 1
            fi

            ( while true; do
                sleep 60
                echo "[heartbeat] .repo=$(du -sh .repo 2>/dev/null | cut -f1) free=$(df -h . | tail -1 | awk '{print $4}')"
              done ) &
            HB=$!

            # -j16 rather than -j4: this sync is network-bound (989 small
            # clones), not CPU-bound, so the core count is the wrong limit.
            # On a warm cache the objects are already in .repo/projects, so
            # this mostly just materialises the working tree.
            if timeout 2700 repo sync -c --no-clone-bundle --no-tags --prune -j16 --verbose; then
              kill "$HB" 2>/dev/null || true
              OK=1
              break
            fi
            kill "$HB" 2>/dev/null || true
            echo "attempt ${attempt} incomplete, resuming in 15s"
            sleep 15
          done

          if [ "$OK" != "1" ] || [ ! -f build/envsetup.sh ]; then
            echo "ERROR: source sync did not complete"
            df -h .
            exit 1
          fi
          echo "sync complete: $(du -sh . | cut -f1)"

      # Save before Drop .repo deletes the thing being cached. continue-on-error
      # so a cache failure can never fail a build that is otherwise fine.
      - name: Save source cache
        if: steps.synccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: aera/.repo
          key: aera-sync-${{ env.MANIFEST_BRANCH }}-v1

      - name: Add the device tree
        run: |
          cd "${WORKDIR}"
          git clone --depth=1 "https://github.com/${{ github.repository }}.git" -b "${DEVICE_BRANCH}" /tmp/dt
          mkdir -p device/xiaomi
          rm -rf "${DEVICE_PATH}"
          cp -a "/tmp/dt/${DEVICE_PATH}" "${DEVICE_PATH}"
          chmod +x "${DEVICE_PATH}/vendorsetup.sh" 2>/dev/null || true
          echo "device tree files: $(find "${DEVICE_PATH}" -type f | wc -l)"

      # .repo holds the full git history of ~1000 projects. It is worthless
      # once the working tree exists, and dropping it reclaims ~18 GB right
      # before the step that needs the space.
      - name: Drop .repo
        run: |
          cd "${WORKDIR}"
          df -h .
          echo "removing .repo"
          rm -rf .repo
          df -h .

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------
      # GOGC/GOMEMLIMIT/GOMAXPROCS keep Soong's Go heap inside the runner's
      # RAM. Measured on this exact runner class (16 GB) by ILYESwsa's F11
      # workflow: soong_build was OOM-killed at ~13.6 GB RSS. 11 GiB plus the
      # 30 GB swap above is the combination that survives; 12 GiB does not
      # leave enough for the compilers.
      - name: Build
        env:
          GOGC: "40"
          GOMEMLIMIT: "11GiB"
          GOMAXPROCS: "2"
          ALLOW_MISSING_DEPENDENCIES: "true"
        run: |
          cd "${WORKDIR}"
          # The wiki is explicit: AERA_BUILD_DEVICE must be set in the calling
          # shell *before* envsetup is sourced, otherwise another tree's exports
          # can leak in and the vendorsetup guard never runs for this device.
          export AERA_BUILD_DEVICE="${DEVICE}"
          set +e
          source build/envsetup.sh
          set -e

          # selene's product is twrp_selene (AndroidProducts.mk) and AERA 16
          # uses the bp2a release name, so the combo is twrp_selene-bp2a-eng.
          # The twrp_ prefix is a build product name, not UI branding, and
          # there is no aera_selene product -- earlier fallbacks to
          # "aera_selene-bp2a-eng" / "twrp_selene-eng" only produced
          # "Invalid lunch combo" noise that hid the real error.
          if ! lunch "${LUNCH}"; then
            echo "::error::lunch ${LUNCH} failed -- see the make error above"
            exit 1
          fi

          # Build the boot-HAL ABI shim before the full build. It takes seconds
          # and lets a wrong symbol name fail here instead of 90 minutes later.
          # The shim is then placed on the recovery overlay path, which is the
          # mechanism this tree already uses to get the MTK boot HAL prebuilt
          # into /system/lib64/hw/ of the ramdisk.
          m libaera_boot_trim

          SHIM=$(find "out/target/product/${DEVICE}" -name libaera_boot_trim.so -print -quit)
          if [ -z "${SHIM}" ]; then
            # 'm <module>' may only produce the Soong intermediate; that is
            # still the exact .so we want on the ramdisk.
            SHIM=$(find out/soong/.intermediates -name libaera_boot_trim.so -print -quit 2>/dev/null)
          fi
          if [ -z "${SHIM}" ]; then
            echo "::error::libaera_boot_trim.so was not produced by 'm libaera_boot_trim'"
            exit 1
          fi
          echo "shim built: ${SHIM}"
          if ! readelf -sW "${SHIM}" | grep -q '_ZN7android4base4TrimERKNSt3__112basic_stringIcNS1_11char_traitsIcEENS1_9allocatorIcEEEE'; then
            echo "::error::libaera_boot_trim.so does not export android::base::Trim(std::string const&)"
            readelf -sW "${SHIM}" | grep -i trim || true
            exit 1
          fi
          mkdir -p "${DEVICE_PATH}/recovery/root/system/lib64"
          cp -f "${SHIM}" "${DEVICE_PATH}/recovery/root/system/lib64/"
          ls -l "${DEVICE_PATH}/recovery/root/system/lib64/libaera_boot_trim.so"

          set +e
          mka adbd "${BUILD_TARGET}"
          rc=$?

          # selene is recovery-as-boot, so bootimage is the normal target.
          # If the boot rule is unavailable on this tree, recoveryimage still
          # produces a flashable image.
          if [ "$rc" -ne 0 ] || ! ls out/target/product/${DEVICE}/*.img >/dev/null 2>&1; then
            echo "--- ${BUILD_TARGET} failed (rc=$rc), retrying with recoveryimage"
            mka adbd recoveryimage
            rc=$?
          fi

          echo "BUILD_RC=$rc"

          # A green build that silently omits the shim would send a still-broken
          # image to the phone, so verify the staged recovery root -- that is
          # exactly what gets packed into the ramdisk.
          if [ "$rc" -eq 0 ]; then
            SHIM_IN_ROOT=$(find "out/target/product/${DEVICE}" \
              -path '*recovery/root/system/lib64/libaera_boot_trim.so' -print -quit 2>/dev/null)
            if [ -z "${SHIM_IN_ROOT}" ]; then
              echo "::error::libaera_boot_trim.so is missing from the staged recovery root; the ramdisk would ship without the boot-HAL shim"
              find "out/target/product/${DEVICE}" -maxdepth 2 -type d 2>/dev/null | head -40 || true
              rc=1
            else
              echo "boot-HAL shim staged at: ${SHIM_IN_ROOT}"
              readelf -sW "${SHIM_IN_ROOT}" | grep -i trim || true
            fi
          fi

          df -h .
          free -h
          exit "$rc"

      # ---------------------------------------------------------------------
      # Artifacts
      # ---------------------------------------------------------------------
      - name: Collect images
        if: always()
        run: |
          # An earlier step may have failed before the workdir existed; do not
          # turn that into a second, confusing error.
          cd "${WORKDIR}" 2>/dev/null || { echo "no workdir, nothing to collect"; exit 0; }
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          ls -lh "out/target/product/${DEVICE}/" 2>/dev/null | head -40 || true
          for f in \
            "out/target/product/${DEVICE}/AERA-R"*.img \
            "out/target/product/${DEVICE}/AERA-R"*.zip \
            "out/target/product/${DEVICE}/boot.img" \
            "out/target/product/${DEVICE}/recovery.img" \
            "out/target/product/${DEVICE}/vendor_boot.img"; do
            [ -f "$f" ] && cp -f "$f" "${GITHUB_WORKSPACE}/artifacts/"
          done
          ls -lh "${GITHUB_WORKSPACE}/artifacts/" || true

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-selene-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aera-selene-${{ github.run_id }}
          name: AERA Recovery selene ${{ github.run_id }}
          files: ${{ github.workspace }}/artifacts/*
          # Loud failure beats a green run with an empty release -- that is
          # exactly how run #6 wasted a night.
          fail_on_unmatched_files: true
          body: |
            AERA Recovery for the Xiaomi Redmi 10 (selene).

            - Target: `${{ env.BUILD_TARGET }}`
            - Manifest: `aera-16.0`
            - Device tree: `${{ env.DEVICE_BRANCH }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::build failed - see the Build step above"
          cd "${WORKDIR}" 2>/dev/null || exit 0
          df -h . || true
          free -h || true
