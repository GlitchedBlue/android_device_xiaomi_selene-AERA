name: Build AERA Recovery (selene)

# AERA for the Xiaomi Redmi 10 (selene), compiled on a GitHub-hosted runner.
#
# Runner recipe is the one that actually ships AERA images (AzzyC's
# Action-OFRP-Builder, 14/20 successes at 78-156 min on the same manifest):
#
#   * ubuntu-24.04 -- NOT 22.04. The 24.04 public image comes with a 145 GB
#     root disk. On 22.04 easimon/maximize-build-space pooled us down to 84 GB,
#     i.e. it was actively costing us space. Do not add it back.
#   * slimhub deletes the preinstalled SDKs/CLR/Haskell/CodeQL that this build
#     never touches.
#   * 30 GB of swap is what lets -j$(nproc) survive Soong's peak RSS on a
#     16 GB runner.
#
# The repository MUST be public. A private repo gets a 2 vCPU / 8 GB runner and
# Soong is OOM-killed about 48 minutes in. Every AERA builder repo that produces
# images is public for exactly this reason.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        type: choice
        default: bootimage
        options:
          - bootimage
          - recoveryimage
          - vendorboot
      device_branch:
        description: 'Device tree branch'
        required: false
        default: aera-16.0
      chain:
        description: 'Generation of the auto-chain (0 = start a fresh chain)'
        required: false
        default: '0'
  push:
    branches:
      - aera-16.0
    paths:
      - 'device/**'
      # The gralloc1 shim has its own minute-long workflow
      # (.github/workflows/gralloc1-shim.yml). It is staged into the blob store
      # on the rescue partition and loaded through ro.aera.gpu.gralloc, so it is
      # not part of the ramdisk: an image build only re-validates it. Editing it
      # alone must not cost two and a half hours.
      - '!device/xiaomi/selene/gralloc1_compat/**'
      # A patch to a synced project only takes effect in an image build.
      - 'patches/**'
      - '.github/workflows/build-aera.yml'

  # Retry has to come from *outside* the job. When a hosted runner dies, none of
  # that job's later steps run -- so the in-job "Queue the next build" step can
  # never fire for the one failure it exists to cover. A schedule event is
  # evaluated by GitHub itself, so it still fires when the runner is gone.
  #
  # Every 30 minutes is much more often than a build can finish (2h+), so the
  # gate job does the real work: it skips unless HEAD has no green build yet and
  # nothing for HEAD is currently running.
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  # v2 because run 43936328986 (commit b6d4bff2, the pre-fix patch step) stopped
  # responding to cancellation and held the old group for over an hour, which
  # queued every fixed build behind a job that could only produce an unpatched
  # image anyway. A new group lets the fixed run start immediately; the old one
  # is left to time out on its own.
  group: aera-selene-v2
  cancel-in-progress: false

permissions:
  contents: write
  # Re-dispatching this workflow is the exception to "events created by
  # GITHUB_TOKEN do not start runs": workflow_dispatch is explicitly allowed.
  actions: write

jobs:
  # Only runs for the cron. A schedule fires blindly, so this decides whether
  # there is anything left to do: skip if HEAD is already green, skip if
  # something for HEAD is still running, and stop after 8 failed attempts so
  # the cron cannot burn 350 minutes at a time forever.
  #
  # It never fails. If the API call breaks it says "go" -- a wasted attempt is
  # cheaper than a gate that silently stalls every future one.
  gate:
    name: Is there anything left to build?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          echo "go=no" >> "${GITHUB_OUTPUT}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          hdr=(-H "Authorization: Bearer ${GITHUB_TOKEN}"
               -H "Accept: application/vnd.github+json"
               -H "X-GitHub-Api-Version: 2022-11-28")
          branch="${GITHUB_REF_NAME}"
          echo "branch ${branch}"

          if ! sha=$(curl -sS "${hdr[@]}" "${api}/branches/${branch}" | jq -r .commit.sha); then
            echo "::warning::could not resolve HEAD; building anyway"
            echo "go=yes" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "head ${sha}"

          if ! runs=$(curl -sS "${hdr[@]}" "${api}/actions/runs?head_sha=${sha}&per_page=100"); then
            echo "::warning::could not list runs; building anyway"
            echo "go=yes" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # This run is itself in the list, and it is 'queued' or 'in_progress'
          # while this step executes -- so it has to be excluded or 'active'
          # would always be at least one and the gate would never open.
          verdict=$(printf '%s' "${runs}" | jq -r --arg me "${GITHUB_RUN_ID}" '
            [ .workflow_runs[]
              | select(.name | startswith("Build AERA"))
              | select((.id | tostring) != $me) ]
            | [ (map(select(.conclusion == "success")) | length),
                (map(select(.status == "in_progress"
                            or .status == "queued"
                            or .status == "pending"
                            or .status == "requested"
                            or .status == "waiting")) | length),
                (map(select(.conclusion == "failure")) | length) ]
            | @tsv')

          read -r green active failed <<< "${verdict}"
          # jq failing must not turn into an arithmetic error under `set -u`.
          green=${green:-0}
          active=${active:-0}
          failed=${failed:-0}
          echo "green=${green} active=${active} failed=${failed}"

          if [ "${green}" -gt 0 ]; then
            echo "HEAD already has a green build; nothing to do"
            exit 0
          fi
          if [ "${active}" -gt 0 ]; then
            echo "${active} run(s) already active for HEAD; letting them finish"
            exit 0
          fi
          if [ "${failed}" -ge 8 ]; then
            echo "::warning::HEAD has ${failed} failed attempts; not retrying automatically"
            exit 0
          fi
          echo "go=yes" >> "${GITHUB_OUTPUT}"

  build:
    name: Build AERA for selene
    needs: [gate]
    # always(), because gate is skipped for every event except the cron, and a
    # skipped dependency would otherwise skip this job too.
    if: always() && (github.event_name != 'schedule' || needs.gate.outputs.go == 'yes')
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      AERA_MANIFEST: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: aera-16.0
      DEVICE: selene
      DEVICE_PATH: device/xiaomi/selene
      LUNCH: twrp_selene-bp2a-eng
      BUILD_TARGET: ${{ github.event.inputs.target || 'bootimage' }}
      DEVICE_BRANCH: ${{ github.event.inputs.device_branch || 'aera-16.0' }}
      WORKDIR: ${{ github.workspace }}/aera
      # Compiler cache. AzzyC's builder -- the recipe this workflow is based on
      # -- measured the same manifest at 2h06m for the build step without it and
      # 1h28m with it, which is 38 minutes for ~4 GB of cache. That is worth
      # more than any tuning of -j, because it removes work instead of
      # redistributing it.
      #
      # USE_CCACHE/CCACHE_EXEC are NOT what soong reads to wrap the compiler.
      # On android16 the only consumer of USE_CCACHE is a single flag in
      # cc/config/global.go (-Wno-unused-command-line-argument); the wrapper
      # comes from cc/builder.go:
      #
      #   Command: "$relPwd ${config.CcWrapper}$ccCmd -c ..."
      #
      # and CcWrapper is ctx.Config().Getenv("CC_WRAPPER"). build/make/core/
      # ccache.mk still sets a *make* variable called CC_WRAPPER, but soong
      # never sees make variables, so that path is dead. CC_WRAPPER has to be
      # exported into the environment, which the Build step does.
      #
      # CCACHE_DIR has to live under github.workspace or the cache action
      # cannot see it.
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content

    steps:
      # ---------------------------------------------------------------------
      # Space / RAM
      # ---------------------------------------------------------------------
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      # slimhub frees the preinstalled toolchains, which is where the ~110 GB of
      # free space at the start comes from. The swap file is carved out of that
      # same disk, so its size is not free: a 30 GB file plus the ~35 GB source
      # tree plus a full out/ is what the build has to fit in.
      #
      # It is back to 30 GB because that is the only configuration that has ever
      # produced a green image on this runner (run #7). The 8 GB experiment was
      # a guess that the vanishing runner was a full disk; there is no evidence
      # for that, and it made the soong analysis peak worse: run 43835500987 was
      # killed at 14.9 GB RSS with swap 5.7/8 GB used, five minutes into Build.
      # Disk is now sampled every 30 s, so the disk theory can be settled with
      # data instead of by starving the memory peak.
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 30

      # These builds do not die from an OOM kill. They die because the GitHub
      # agent loses its heartbeat while the box thrashes. Measured in run
      # 43851152934: soong_build held 13.8 GB resident while 19.6 GB sat in
      # *disk* swap, PSI avg10 ran 10-44%, and load sat near 5 on 4 vCPUs. Every
      # page fault during soong's analysis was a round trip to the swapfile, and
      # with ~30 GB of live working set on a 16 GB box that never stops.
      #
      # zram gives the kernel a swap device that lives in RAM and is compressed
      # (lz4, roughly 2.5x on this kind of data), so most of the overflow costs
      # a memcpy instead of a disk seek. It is swapon'd at priority 100, above
      # the swapfile's auto-assigned -2, so zram fills first and the 30 GB file
      # only catches what will not compress.
      #
      # swappiness 100 is the recommended value for zram: with a fast compressed
      # device, evicting anonymous pages is cheaper than dropping page cache.
      #
      # This step used to warn and `exit 0` on every failure, and that is how
      # run 43948741249 lost its runner: its telemetry reported SwapTotal
      # 33791 MB -- the 30 GB file plus the image's own 3 GB, i.e. **no zram at
      # all** -- while this step was green. Soong's analysis then ran with half
      # the swap it was tuned for, and 45 minutes into Build the box stopped
      # answering. Never let the swap layout be a guess again.
      #
      # The 20261111 runner image now ships zram0 already active (3 GB), which
      # made the old "size zram0" line fail with EBUSY and killed run
      # 44141489469 four minutes in, before it built anything. Take a device
      # that is not already swap, and hot_add one if they are all taken.
      - name: Add compressed RAM swap
        run: |
          set -euo pipefail
          sudo modprobe zram 2>/dev/null || true
          if [ ! -e /sys/block/zram0 ]; then
            echo "::error::no zram device - modprobe zram failed"
            exit 1
          fi

          active=$(swapon --noheadings --show=NAME 2>/dev/null || true)
          echo "already swap: ${active:-none}"

          pick=""
          idx=""
          for n in 0 1 2 3 4 5 6 7; do
            dev="/dev/zram${n}"
            if [ ! -e "${dev}" ]; then
              # hot_add creates the next device and prints its index.
              [ -e /sys/class/zram-control/hot_add ] || continue
              sudo sh -c 'cat /sys/class/zram-control/hot_add' >/dev/null 2>&1 || true
              [ -e "${dev}" ] || continue
            fi
            # Skip anything already carrying swap, or already sized.
            if printf '%s\n' "${active}" | grep -qx "${dev}"; then
              continue
            fi
            if [ "$(sudo cat /sys/block/zram${n}/disksize 2>/dev/null || echo 0)" != "0" ]; then
              continue
            fi
            pick="${dev}"
            idx="${n}"
            break
          done

          if [ -z "${pick}" ]; then
            echo "::error::no free zram device (already swap: ${active:-none})"
            exit 1
          fi
          echo "using ${pick} for compressed swap"

          for alg in lz4 zstd; do
            if echo "${alg}" | sudo tee /sys/block/zram${idx}/comp_algorithm >/dev/null 2>&1; then
              echo "zram compression: ${alg}"
              break
            fi
          done
          if ! echo 24G | sudo tee /sys/block/zram${idx}/disksize >/dev/null; then
            echo "::error::could not size ${pick}"
            exit 1
          fi
          sudo mkswap "${pick}" >/dev/null
          sudo swapon --priority 100 "${pick}"
          sudo sysctl -w vm.swappiness=100 >/dev/null
          echo "--- swap devices (zram first) ---"
          swapon --show
          total=$(awk '/^SwapTotal:/ {print int($2/1024)}' /proc/meminfo)
          echo "SwapTotal: ${total} MB"
          if [ "${total}" -lt 50000 ]; then
            echo "::error::SwapTotal is ${total} MB, expected >= 50000 (30 GB file + 24 GB zram). zram is not active; refusing to start a 2 hour build that will thrash."
            swapon --show
            exit 1
          fi

      - name: Show resources
        run: |
          echo "cores: $(nproc)"
          df -h /
          free -h
          # The swap layout is the single most important line in this log: the
          # build only survives on ~54 GB of it, 24 of which must be zram.
          swapon --show

      # ---------------------------------------------------------------------
      # Toolchain
      # ---------------------------------------------------------------------
      # OrangeFox's android_build_env.sh is the de-facto standard, but on noble
      # it is effectively a no-op (it only pulls software-properties-common) --
      # the ubuntu-24.04 image already carries most of the Android toolchain.
      # The extras below are therefore filtered by availability: Ubuntu 24.04
      # dropped the 22.04-era names (libncurses5, lib32ncurses5-dev do not
      # exist on noble) and one unknown name aborts the whole apt transaction.
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y

          if curl -fsSL -o /tmp/android_build_env.sh \
               "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"; then
            sudo bash /tmp/android_build_env.sh || true
          fi

          WANTED="git-core gnupg flex bison build-essential zip curl zlib1g-dev \
                  libc6-dev-i386 libncurses-dev lib32ncurses-dev libncurses5 \
                  lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
                  libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
                  python3 python-is-python3 rsync lz4 bc ccache imagemagick libssl-dev \
                  cpio xz-utils"
          AVAILABLE=""
          for pkg in $WANTED; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              AVAILABLE="$AVAILABLE $pkg"
            else
              echo "skipping (not packaged here): $pkg"
            fi
          done
          sudo apt-get install -y $AVAILABLE

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          repo --version

          git config --global user.name "AERA Builder"
          git config --global user.email "builder@github.local"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      # ---------------------------------------------------------------------
      # Compiler cache
      # ---------------------------------------------------------------------
      # A rolling key with a prefix restore-key: the exact key never matches, so
      # every run restores the newest ccache that exists and then saves its own.
      # That is deliberate -- a static key (what AzzyC's workflow uses) freezes
      # the cache at the first successful save and stops improving, and this
      # build is going to need several attempts before one survives.
      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: aera-ccache-${{ env.MANIFEST_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            aera-ccache-${{ env.MANIFEST_BRANCH }}-

      # ---------------------------------------------------------------------
      # Source
      # ---------------------------------------------------------------------
      # The AERA manifest is ~1000 projects. Sync is the fragile part: a dead
      # remote used to hang forever on a credential prompt, and a killed
      # attempt leaves packfiles behind, so the resume loop can itself bloat
      # .repo. Hence: fail fast on prompts, a 45 minute cap per attempt, a
      # heartbeat so the runner never goes silent for an hour, and a free
      # space guard that fails loudly instead of burning half an hour.
      #
      # The .repo cache is worth ~12 minutes per attempt. Measured on
      # ILYESwsa's F11 workflow (same manifest, same runner class):
      #   restore 18.8 GB cache   3m39s
      #   repo sync after restore  3m46s
      #   total                     ~7m30s   (vs ~20m cold)
      # It is an 18.8 GB entry, well over the 10 GB free-tier figure -- it
      # restores fine in practice, so do not "fix" it by trimming the path.
      - name: Restore source cache
        id: synccache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: aera/.repo
          key: aera-sync-${{ env.MANIFEST_BRANCH }}-v1

      - name: Sync AERA sources
        run: |
          mkdir -p "${WORKDIR}"
          cd "${WORKDIR}"

          repo init --depth=1 -u "${AERA_MANIFEST}" -b "${MANIFEST_BRANCH}"
          find .repo/manifests -name '*.xml' -exec sed -i 's|ssh://git@github.com/|https://github.com/|g' {} + || true

          export GIT_TERMINAL_PROMPT=0
          OK=0
          for attempt in 1 2 3; do
            FREE_GB=$(df --output=avail -BG . | tail -1 | tr -dc '0-9')
            echo "--- sync attempt ${attempt}: ${FREE_GB}G free"
            if [ "${FREE_GB}" -lt 15 ]; then
              echo "ERROR: only ${FREE_GB}G free at attempt start"
              exit 1
            fi

            ( while true; do
                sleep 60
                echo "[heartbeat] .repo=$(du -sh .repo 2>/dev/null | cut -f1) free=$(df -h . | tail -1 | awk '{print $4}')"
              done ) &
            HB=$!

            # -j16 rather than -j4: this sync is network-bound (989 small
            # clones), not CPU-bound, so the core count is the wrong limit.
            # On a warm cache the objects are already in .repo/projects, so
            # this mostly just materialises the working tree.
            if timeout 2700 repo sync -c --no-clone-bundle --no-tags --prune -j16 --verbose; then
              kill "$HB" 2>/dev/null || true
              OK=1
              break
            fi
            kill "$HB" 2>/dev/null || true
            echo "attempt ${attempt} incomplete, resuming in 15s"
            sleep 15
          done

          if [ "$OK" != "1" ] || [ ! -f build/envsetup.sh ]; then
            echo "ERROR: source sync did not complete"
            df -h .
            exit 1
          fi
          echo "sync complete: $(du -sh . | cut -f1)"

      # Disabled on purpose: GitHub allows 10 GB of cache per repository and this
      # entry is 18.8 GB, so writing it evicts the compiler cache and writing
      # the compiler cache evicts it. Measured on 2026-11-16:
      #
      #   run 43899667091  restored this cache (267 s) -> repo sync 460 s
      #                    instead of 788 s, i.e. it is worth ~5 minutes
      #   run 43899667091  saved 1.05 GB of ccache, which evicted this entry
      #
      # The compile phase of that run was ~43 of 88 minutes, so ccache is worth
      # far more than 5 minutes even at a mediocre hit rate. ccache therefore
      # owns the whole 10 GB and this stays off. It also keeps the size of a run
      # predictable: repo sync is ~13 minutes, every time, instead of depending
      # on which cache happened to survive.
      #
      # The restore step above is left enabled because it costs nothing on a miss
      # and is a free 5 minutes on the rare run where the entry still exists.
      - name: Save source cache
        if: false
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: aera/.repo
          key: aera-sync-${{ env.MANIFEST_BRANCH }}-v1

      # ---------------------------------------------------------------------
      # Mali GPU backend
      # ---------------------------------------------------------------------
      # apkreader's mali-testing branch adds the stock-driver Mali backend on
      # top of exactly the recovery commit this manifest pins (e438f6d) and the
      # LVGL base (6267941). Switch the checkout and apply the four LVGL
      # patches; --check verifies the sequence before touching anything.
      - name: Apply Mali GPU backend
        run: |
          cd "${WORKDIR}"
          git -C bootable/recovery fetch --depth=1 \
            https://github.com/apkreader/android_bootable_recovery.git mali-testing
          git -C bootable/recovery switch --detach FETCH_HEAD
          test -f bootable/recovery/aeraui/core/mali_display.cpp \
            || { echo "::error::mali_display.cpp is missing after the branch switch"; exit 1; }
          grep -q 'core/mali_display.cpp' bootable/recovery/aeraui/Android.bp \
            || { echo "::error::aeraui/Android.bp does not list mali_display.cpp"; exit 1; }
          python3 bootable/recovery/aeraui/tools/prepare-mali-lvgl.py --check
          python3 bootable/recovery/aeraui/tools/prepare-mali-lvgl.py
          echo "mali backend: $(git -C bootable/recovery rev-parse --short HEAD)"
          echo "lvgl:         $(git -C external/lvgl rev-parse --short HEAD)"

      # The build job never checked this repository out. ${GITHUB_WORKSPACE}
      # therefore had no patches/ directory, so the patch loop below walked a
      # glob that matched nothing, and run 43899667091 logged
      #
      #   patches applied: 0
      #
      # while every step stayed green. That is the whole reason the image it
      # produced contains none of the GPU patches: the compiler was handed the
      # pristine apkreader sources. Check the repository out explicitly, and use
      # the same checkout for the device tree so there is only one clone.
      - name: Check out this repository (device tree and patches)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Add the device tree
        run: |
          cd "${WORKDIR}"
          src="${GITHUB_WORKSPACE}/src"
          test -d "${src}/${DEVICE_PATH}" \
            || { echo "::error::${DEVICE_PATH} is missing from the checkout"; ls -la "${src}"; exit 1; }
          test -d "${src}/patches" \
            || { echo "::error::patches/ is missing from the checkout"; ls -la "${src}"; exit 1; }
          mkdir -p device/xiaomi
          rm -rf "${DEVICE_PATH}"
          cp -a "${src}/${DEVICE_PATH}" "${DEVICE_PATH}"
          chmod +x "${DEVICE_PATH}/vendorsetup.sh" 2>/dev/null || true
          echo "device tree files: $(find "${DEVICE_PATH}" -type f | wc -l)"
          echo "patch files: $(find "${src}/patches" -name '*.patch' | wc -l)"

      # ---------------------------------------------------------------------
      # Local patches to synced projects
      # ---------------------------------------------------------------------
      # The Mali backend comes from apkreader's mali-testing branch, which is not
      # ours to push to, and the fixes it needs are small and specific. They live
      # in patches/<project path>/NNNN-*.patch in this repo and are applied here,
      # after the branch switch above.
      #
      # `git apply --check` runs first for every patch: a context mismatch has to
      # fail the build in the first two minutes, not after two and a half hours
      # with an image that silently lacks the fix.
      - name: Apply local patches
        run: |
          cd "${WORKDIR}"
          root="${GITHUB_WORKSPACE}/src/patches"
          if [ ! -d "${root}" ]; then
            echo "::error::${root} does not exist -- the checkout step did not run or did not include patches/"
            ls -la "${GITHUB_WORKSPACE}" || true
            exit 1
          fi
          shopt -s globstar nullglob
          # Materialise the glob first and count it. The old loop ran straight
          # over "$root"/**/*.patch, so a glob that matched nothing left the
          # whole step green while changing no file at all -- which is how run
          # 43899667091 shipped an image whose recovery binary provably contains
          # none of these patches (no Impl::Vsync in .gnu_debugdata, no
          # "vsync/refresh registration" string, .text byte-identical to the
          # image built before the patches existed).
          files=("$root"/**/*.patch)
          echo "patch files found: ${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the patch glob matched nothing; refusing to build an unpatched image"
            ls -la "${root}" || true
            exit 1
          fi
          count=0
          for patch in "${files[@]}"; do
            project="${patch#"$root"/}"
            project="${project%/*}"
            echo "applying $(basename "$patch") to ${project}"
            if ! git -C "${project}" apply --check "${patch}"; then
              echo "::error::$(basename "$patch") does not apply to ${project} (upstream context changed)"
              exit 1
            fi
            git -C "${project}" apply "${patch}"
            count=$((count + 1))
          done
          echo "patches applied: ${count}"
          if [ "${count}" -ne "${#files[@]}" ]; then
            echo "::error::applied ${count} of ${#files[@]} patches"
            exit 1
          fi
          git -C bootable/recovery --no-pager log --oneline -1
          git -C bootable/recovery --no-pager diff --stat
          git -C bootable/recovery --no-pager status --short

          # The patches are applied to a working tree that the build is then
          # expected to read. Prove the markers are in that tree, so a revert or
          # a wrong working directory fails here and not 90 minutes later.
          fail=0
          grep -q 'vsync/refresh registration' \
            bootable/recovery/aeraui/core/mali_display.cpp \
            || { echo "::error::patch 0002 is not in aeraui/core/mali_display.cpp"; fail=1; }
          grep -q 'DescribeBuffer' \
            bootable/recovery/aeraui/core/mali_display.cpp \
            || { echo "::error::patch 0003 is not in aeraui/core/mali_display.cpp"; fail=1; }
          grep -q 'dma-buf import %u failed' \
            bootable/recovery/aeraui/core/gpu_renderer.cpp \
            || { echo "::error::patch 0003 is not in aeraui/core/gpu_renderer.cpp"; fail=1; }
          if grep -q 'if (composer_library) dlclose(composer_library);' \
               bootable/recovery/aeraui/core/mali_display.cpp; then
            echo "::error::patch 0001 is not in aeraui/core/mali_display.cpp"
            fail=1
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "::error::the patches applied but the markers are missing from the tree"
            exit 1
          fi
          echo "patch markers verified in the working tree"

      # .repo holds the full git history of ~1000 projects. It is worthless
      # once the working tree exists, and dropping it reclaims ~18 GB right
      # before the step that needs the space.
      - name: Drop .repo
        run: |
          cd "${WORKDIR}"
          df -h .
          echo "removing .repo"
          rm -rf .repo
          df -h .

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------
      # The dieD 4.19 kernel prebuilt is 12384187 bytes, over the 8 MB ceiling
      # the GitHub contents/blob API enforces per file, so the device tree
      # stores it as Image.gz.00 + Image.gz.01 and joins it here. Doing it as a
      # separate step means a corrupt part fails in seconds instead of after
      # the build, and the size/md5 check is in the script itself.
      - name: Assemble kernel prebuilt
        run: |
          cd "${WORKDIR}/${DEVICE_PATH}"
          ls -l prebuilt/
          ./prebuilt/assemble-kernel.sh

      # GOGC/GOMEMLIMIT/GOMAXPROCS bound Soong's Go heap.
      #
      # 40 / 11GiB / 2 is the combination from run #7, the only build that has
      # ever produced an image here (148.7 min wall, Build 7987 s). It is also
      # what ILYESwsa's F11 workflow uses on the same runner class.
      #
      # 14 GiB was tried in run 43862828722, on the theory that 11 GiB was below
      # the working set and causing a GC spiral. It did not help: that run died
      # at ~64 minutes in Build with soong_build at 14.8 GB RSS *and* 17 GB
      # swapped, i.e. a ~30 GB live working set. Soong has no
      # runtime/debug.SetMemoryLimit call anywhere (checked cmd/soong_build and
      # ui/build), so GOMEMLIMIT does reach the Go runtime -- the analysis
      # genuinely needs ~30 GB and no GC setting changes that. The limit is not
      # what keeps this alive; the 30 GB swap file is.
      #
      # Back to 11 GiB, the proven value. Do not raise it again expecting a
      # memory win; the only thing that reliably survives is more swap.
      - name: Build
        env:
          GOGC: "40"
          GOMEMLIMIT: "11GiB"
          GOMAXPROCS: "2"
          ALLOW_MISSING_DEPENDENCIES: "true"
          # The sampler inside this step posts commit comments, and the token
          # is not exported automatically -- it has to be named here or the
          # sampler dies on KeyError at startup and we are blind again.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${WORKDIR}"

          # Compiler cache. Soong only uses ccache when USE_CCACHE and
          # CCACHE_EXEC are both set in the build's own environment, and -z
          # zeroes the counters so the stats at the end of this step describe
          # this run instead of the history of the restored cache.
          if command -v ccache >/dev/null 2>&1; then
            export USE_CCACHE=1
            export CCACHE_EXEC="$(command -v ccache)"
            # The variable soong actually reads (cc/builder.go). Without it
            # every clang call goes straight to clang and the cache stays empty.
            export CC_WRAPPER="${CCACHE_EXEC}"
            mkdir -p "${CCACHE_DIR}"
            ccache -M "${CCACHE_MAXSIZE}" >/dev/null 2>&1 || true
            ccache -z >/dev/null 2>&1 || true
            echo "ccache: ${CCACHE_EXEC} max ${CCACHE_MAXSIZE} dir ${CCACHE_DIR}"
            du -sh "${CCACHE_DIR}" 2>/dev/null || true
          else
            echo "::warning::ccache is not installed; building without a compiler cache"
            unset USE_CCACHE CCACHE_EXEC CC_WRAPPER
          fi

          # -------------------------------------------------------------------
          # Instruments, started here on purpose
          # -------------------------------------------------------------------
          # A background process started in an earlier step gets reaped when
          # that step ends: the first sampler posted at t+0 and t+91s and then
          # went silent for the remaining 46 minutes of the job. Starting them
          # inside the step they watch is what makes them live long enough to
          # be useful.
          #
          # Everything here is posted as a commit comment, which lives on
          # GitHub rather than on the runner. A runner that dies uploads no log
          # (the blob is 404), so the last comment is the only record of the
          # state at the moment it stopped answering.
          cat > /tmp/telemetry.py <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request

          TOKEN = os.environ["GITHUB_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          SHA = os.environ["GITHUB_SHA"]
          WORKDIR = os.environ.get("WORKDIR", ".")
          API = "https://api.github.com"


          def post(text):
              req = urllib.request.Request(
                  API + "/repos/%s/commits/%s/comments" % (REPO, SHA),
                  data=json.dumps({"body": text}).encode(),
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "aera-telemetry",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode() or "{}")


          def sh(cmd, limit=20):
              # `timeout` goes INSIDE the command. subprocess.run's own timeout
              # kills only bash; a grandchild holding the pipe then makes the
              # follow-up communicate() block forever, which is how the previous
              # sampler went silent at t+155s while the job lived on.
              try:
                  p = subprocess.run(
                      ["bash", "-lc", "timeout %d %s" % (limit, cmd)],
                      capture_output=True,
                      text=True,
                      timeout=limit + 10,
                  )
                  return (p.stdout or p.stderr).strip().replace("\n", " ")
              except Exception as e:
                  return "err:%s" % type(e).__name__


          def meminfo():
              d = {}
              with open("/proc/meminfo") as fh:
                  for line in fh:
                      k, v = line.split(":", 1)
                      d[k] = int(v.split()[0]) // 1024
              return d


          lines = []
          t0 = time.time()
          n = 0
          out = "?"
          while True:
              el = int(time.time() - t0)
              # /proc reads: no subprocess, so they still work while the box is
              # thrashing. MemAvailable is the number that actually predicts the
              # OOM killer, and it is not in `free` output.
              m = meminfo()
              mem = "used %d/%d MB avail %d" % (
                  m["MemTotal"] - m["MemAvailable"],
                  m["MemTotal"],
                  m["MemAvailable"],
              )
              swp = "%d/%d MB" % (m["SwapTotal"] - m["SwapFree"], m["SwapTotal"])
              load = " ".join(open("/proc/loadavg").read().split()[:3])
              try:
                  p = open("/proc/pressure/memory").readline().split()
                  psi = "avg10=%s total=%s" % (
                      p[1].split("=")[1],
                      p[4].split("=")[1],
                  )
              except Exception:
                  psi = "?"
              disk = sh("df -h / | tail -1 | awk '{print $3\" used, \"$4\" avail, \"$5}'")
              if n % 2 == 0:
                  out = sh("du -sm '%s/out' 2>/dev/null | cut -f1" % WORKDIR) or "?"
              nclang = sh("pgrep -c clang 2>/dev/null || echo 0")
              top = sh(
                  "ps -eo rss,comm --sort=-rss | sed -n '2,4p' "
                  "| awk '{printf \"%s=%dM \", $2, $1/1024}'"
              )
              lines.append(
                  "t+%5ds | disk %s | out %sM | mem %s | swap %s | load %s "
                  "| psi %s | clang %s | %s"
                  % (el, disk, out, mem, swp, load, psi, nclang, top)
              )
              if n % 5 == 0:
                  # dmesg is the only source that says outright whether the
                  # kernel OOM-killed something, and which process it chose.
                  klog = sh(
                      "sudo -n dmesg -T | tail -6 | tr '\\n' '|' | cut -c1-500",
                      12,
                  )
                  if klog:
                      lines.append("    klog: " + klog)
              lines = lines[-40:]
              n += 1
              try:
                  post(
                      "**build telemetry** #%d pid=%d\n\n```\n%s\n```\n"
                      % (n, os.getpid(), "\n".join(lines))
                  )
              except Exception as e:
                  print("post failed:", e, flush=True)
              time.sleep(30)
          PY
          setsid nohup python3 -u /tmp/telemetry.py > /tmp/telemetry.log 2>&1 &
          sleep 3
          head -3 /tmp/telemetry.log 2>/dev/null || true

          # Two ways this runner dies without leaving a log, both converted here
          # into an ordinary failure while the machine can still answer:
          #
          #   1. disk full -> the log cannot be uploaded, the runner vanishes.
          #   2. memory thrash -> the box stops answering entirely. Run
          #      43948741249 was last heard from at t+124s of Build (soong_build
          #      12.2 GB, PSI 6.21 and climbing) and was reported dead 45
          #      minutes later with no log at all. PSI is the kernel's own
          #      measure of how much time is lost to stalls, so a sustained high
          #      value is the box already failing, not a prediction.
          #
          # The PSI thresholds are deliberately far above anything a surviving
          # build has produced (run 43936328986 finished a full image at
          # avg10=43), so this aborts only the state that kills the runner.
          cat > /tmp/watchdog.sh <<'SH'
          #!/bin/bash
          stall=0
          while true; do
            avail=$(df --output=avail -m / | tail -1 | tr -d ' ')
            if [ "${avail}" -lt 2048 ]; then
              echo "::error::disk nearly full (${avail} MB free) - aborting before the runner dies"
              touch /tmp/diskfull
              df -h /
              du -sh "${WORKDIR}/out" 2>/dev/null | tail -1
              du -sh "${WORKDIR}"/out/* 2>/dev/null | sort -h | tail -10
              pkill -f soong_ui || true
              pkill -f ninja || true
              exit 1
            fi
            avail_mb=$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo)
            psi=$(awk '/^some/ {sub("avg10=","",$2); print int($2)}' /proc/pressure/memory)
            if [ "${avail_mb}" -lt 250 ] && [ "${psi}" -ge 70 ]; then
              stall=$((stall + 1))
            else
              stall=0
            fi
            if [ "${stall}" -ge 6 ]; then
              echo "::error::memory thrash for ${stall}0s (avail ${avail_mb} MB, PSI avg10 ${psi}%) - aborting before the runner stops answering"
              touch /tmp/thrash
              free -h
              swapon --show
              ps -eo rss,comm --sort=-rss | head -5
              pkill -f soong_ui || true
              pkill -f ninja || true
              exit 1
            fi
            sleep 10
          done
          SH
          chmod +x /tmp/watchdog.sh
          setsid nohup /tmp/watchdog.sh > /tmp/watchdog.log 2>&1 &
          echo "watchdog armed: $(df -h / | tail -1 | awk '{print $4}') free, swap $(awk '/^SwapTotal:/ {print int($2/1024)}' /proc/meminfo) MB"


          # The wiki is explicit: AERA_BUILD_DEVICE must be set in the calling
          # shell *before* envsetup is sourced, otherwise another tree's exports
          # can leak in and the vendorsetup guard never runs for this device.
          export AERA_BUILD_DEVICE="${DEVICE}"
          set +e
          source build/envsetup.sh
          set -e

          # selene's product is twrp_selene (AndroidProducts.mk) and AERA 16
          # uses the bp2a release name, so the combo is twrp_selene-bp2a-eng.
          # The twrp_ prefix is a build product name, not UI branding, and
          # there is no aera_selene product -- earlier fallbacks to
          # "aera_selene-bp2a-eng" / "twrp_selene-eng" only produced
          # "Invalid lunch combo" noise that hid the real error.
          if ! lunch "${LUNCH}"; then
            echo "::error::lunch ${LUNCH} failed -- see the make error above"
            exit 1
          fi

          # Build the boot-HAL ABI shim before the full build. It takes seconds
          # and lets a wrong symbol name fail here instead of 90 minutes later.
          # The shim is staged on the recovery overlay at /sbin: that is rootfs
          # and therefore survives a zip installer mounting the system partition
          # over /system. (A /system path made getprop unexecutable mid-install:
          #   CANNOT LINK EXECUTABLE "getprop": library
          #     "/system/lib64/libaera_boot_trim.so" not found)
          m libaera_boot_trim

          SHIM=$(find "out/target/product/${DEVICE}" -name libaera_boot_trim.so -print -quit)
          if [ -z "${SHIM}" ]; then
            # 'm <module>' may only produce the Soong intermediate; that is
            # still the exact .so we want on the ramdisk.
            SHIM=$(find out/soong/.intermediates -name libaera_boot_trim.so -print -quit 2>/dev/null)
          fi
          if [ -z "${SHIM}" ]; then
            echo "::error::libaera_boot_trim.so was not produced by 'm libaera_boot_trim'"
            exit 1
          fi
          echo "shim built: ${SHIM}"
          if ! readelf -sW "${SHIM}" | grep -q '_ZN7android4base4TrimERKNSt3__112basic_stringIcNS1_11char_traitsIcEENS1_9allocatorIcEEEE'; then
            echo "::error::libaera_boot_trim.so does not export android::base::Trim(std::string const&)"
            readelf -sW "${SHIM}" | grep -i trim || true
            exit 1
          fi
          mkdir -p "${DEVICE_PATH}/recovery/root/sbin"
          cp -f "${SHIM}" "${DEVICE_PATH}/recovery/root/sbin/"
          ls -l "${DEVICE_PATH}/recovery/root/sbin/libaera_boot_trim.so"

          # The gralloc1 shim is in PRODUCT_PACKAGES, so `mka` builds it as
          # part of the image; a separate `m libaera_gralloc1` here would cost a
          # second full soong analysis (a ~9 GB, several-minute step) for a
          # module the build already produces. Its assertions moved to after
          # the build, where the artefact actually exists.
          set +e
          # Run the build to completion, the way AzzyC's builder does. There
          # used to be a `timeout` budget here, to end the step before a
          # supposed wall at ~47 minutes so that ccache would survive. It was
          # wrong in three ways:
          #
          #   1. A dead runner never saves a cache anyway, so it could not
          #      protect the thing it existed to protect.
          #   2. It ended run 43851152934 at 25 minutes having compiled nothing
          #      at all -- soong analysis alone ran past 41 minutes on this box,
          #      so every chained successor re-analysed forever and produced not
          #      one object file.
          #   3. `timeout` signalled the soong_ui.bash wrapper, not the
          #      soong_build child. soong_build kept running as an orphan and
          #      the step hung until the run was cancelled by hand.
          #
          # The job's own timeout-minutes is the guard against a hang.
          # The gralloc1 shim is in PRODUCT_PACKAGES, but PRODUCT_PACKAGES only
          # feeds the system/vendor images -- `bootimage` never pulls those in,
          # so the module has to be named on the command line or it is simply
          # never built. That is exactly what failed in run 43899667091: the
          # build itself was green (rc=0, images collected) and only the
          # assertion below caught the missing .so.
          #
          # Building it here costs nothing extra: soong has already analysed the
          # tree, so this is one more ninja edge, not a second analysis.
          build/soong/soong_ui.bash --make-mode adbd "${BUILD_TARGET}" libaera_gralloc1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ -e /tmp/diskfull ]; then
              # The watchdog already killed this build on purpose. Retrying
              # would either die the same way or spend the budget compiling
              # into a full disk.
              echo "::error::aborted by the disk watchdog; not retrying"
            elif [ -e /tmp/thrash ]; then
              # Same reasoning: the box was 70%+ stalled for a minute, which is
              # the state that loses the runner. Retrying inside the same job
              # would hit the same wall with less swap than it started with.
              echo "::error::aborted by the memory watchdog after sustained PSI stall; not retrying"
              cat /tmp/watchdog.log 2>/dev/null || true
            elif ! ls out/target/product/${DEVICE}/*.img >/dev/null 2>&1; then
              # selene is recovery-as-boot, so bootimage is the normal target.
              # If the boot rule is unavailable on this tree, recoveryimage
              # still produces a flashable image.
              echo "--- ${BUILD_TARGET} failed (rc=$rc), retrying with recoveryimage"
              build/soong/soong_ui.bash --make-mode adbd recoveryimage libaera_gralloc1
              rc=$?
            fi
          fi

          echo "BUILD_RC=$rc"

          # The gralloc1 shim assertions, moved here because the module is now
          # produced by mka rather than by a separate `m` invocation.
          #
          # These used to `exit 1` on the first problem, so every failing run
          # revealed exactly one issue and the checks after it never ran -- each
          # discovery cost a 90 minute rebuild. They all run now and the step
          # fails once at the end.
          FAIL=0
          if [ "$rc" -eq 0 ]; then
            # The GPU patches have to be visible in the binary that actually
            # ships. Run 43899667091 produced a green image whose
            # /system/bin/recovery provably contained none of them: its
            # .gnu_debugdata exports Impl::Hotplug but not Impl::Vsync or
            # MaliDisplay::DescribeBuffer, and none of the patches' log strings
            # are present. Checking the artefact, not the source tree, is the
            # only way to catch a build that ignored the patched working tree.
            RECOVERY_BIN=$(find "out/target/product/${DEVICE}" \
              -path '*recovery/root/system/bin/recovery' -print -quit 2>/dev/null)
            if [ -z "${RECOVERY_BIN}" ]; then
              RECOVERY_BIN=$(find out/soong/.intermediates "out/target/product/${DEVICE}" \
                -path '*/recovery' -type f -print -quit 2>/dev/null)
            fi
            if [ -z "${RECOVERY_BIN}" ]; then
              echo "::error::the built recovery binary was not found; cannot verify the GPU patches are in it"
              FAIL=1
            else
              echo "recovery binary: ${RECOVERY_BIN} ($(stat -c %s "${RECOVERY_BIN}") bytes)"
              for marker in 'vsync/refresh registration' 'dma-buf import %u failed'; do
                if grep -qa -- "${marker}" "${RECOVERY_BIN}"; then
                  echo "patch marker present: ${marker}"
                else
                  echo "::error::the built recovery binary does not contain '${marker}' -- the local patches did not reach the compiler"
                  FAIL=1
                fi
              done
            fi

            # Soong builds this module for both ABIs unless the .bp pins one.
            # Run 43936328986 found the 32-bit android_arm_armv8-2a variant
            # first, which is why it failed here; recovery is AArch64, so pick
            # the 64-bit object instead of whichever `find` happens to return.
            mapfile -t GRALLOC_ALL < <(find out/soong/.intermediates \
              "out/target/product/${DEVICE}" -name libaera_gralloc1.so 2>/dev/null)
            GRALLOC=""
            for candidate in "${GRALLOC_ALL[@]}"; do
              if readelf -hW "${candidate}" 2>/dev/null | grep -q 'AArch64'; then
                GRALLOC="${candidate}"
                break
              fi
            done
            if [ -z "${GRALLOC}" ]; then
              echo "::error::no AArch64 libaera_gralloc1.so was produced (found: ${GRALLOC_ALL[*]:-nothing}). It is in PRODUCT_PACKAGES, which only feeds the system/vendor images, so 'bootimage' has to name it on the make command line."
              FAIL=1
            else
              echo "gralloc shim built: ${GRALLOC}"
              if ! readelf -hW "${GRALLOC}" | grep -q 'AArch64'; then
                echo "::error::libaera_gralloc1.so is not an AArch64 object"
                readelf -hW "${GRALLOC}" || true
                FAIL=1
              fi
              # dlsym(HAL_MODULE_INFO_SYM_AS_STR) is how mali_display.cpp finds
              # the module, so a hidden symbol would make the HAL invisible. Note
              # the name: hardware.h defines HAL_MODULE_INFO_SYM as HMI, and
              # HAL_MODULE_INFO_SYM_AS_STR as "HMI" -- grepping for the macro
              # name matches nothing at all.
              if ! readelf --dyn-syms -W "${GRALLOC}" | grep -qE 'OBJECT +GLOBAL +DEFAULT +[0-9]+ HMI$'; then
                echo "::error::libaera_gralloc1.so does not export HMI (HAL_MODULE_INFO_SYM)"
                readelf --dyn-syms -W "${GRALLOC}" || true
                FAIL=1
              fi
              # The private namespace is linked to the recovery process for
              # exactly libc/libm/libdl. Any other DT_NEEDED would have to be
              # staged into the blob store as well, so fail loudly instead of
              # shipping a shim that cannot resolve.
              if readelf -dW "${GRALLOC}" | grep NEEDED | grep -Ev 'libc\.so|libm\.so|libdl\.so'; then
                echo "::error::libaera_gralloc1.so depends on a library the Mali namespace does not share"
                FAIL=1
              fi
              mkdir -p "${GITHUB_WORKSPACE}/artifacts"
              cp -f "${GRALLOC}" "${GITHUB_WORKSPACE}/artifacts/gralloc.mt6768.so"
              ls -l "${GITHUB_WORKSPACE}/artifacts/gralloc.mt6768.so"
            fi
          else
            echo "::notice::build did not finish (rc=${rc}); skipping the gralloc1 shim assertions"
          fi


          # A green build that silently omits the shim would send a still-broken
          # image to the phone, so verify the staged recovery root -- that is
          # exactly what gets packed into the ramdisk.
          if [ "$rc" -eq 0 ]; then
            SHIM_IN_ROOT=$(find "out/target/product/${DEVICE}" \
              -path '*recovery/root/sbin/libaera_boot_trim.so' -print -quit 2>/dev/null)
            if [ -z "${SHIM_IN_ROOT}" ]; then
              echo "::error::libaera_boot_trim.so is missing from the staged recovery root; the ramdisk would ship without the boot-HAL shim"
              find "out/target/product/${DEVICE}" -maxdepth 2 -type d 2>/dev/null | head -40 || true
              FAIL=1
            else
              echo "boot-HAL shim staged at: ${SHIM_IN_ROOT}"
              readelf -sW "${SHIM_IN_ROOT}" | grep -i trim || true
            fi

            # The preload must be scoped to the boot HAL and point at /sbin.
            # A global export, or a /system path, breaks zip installers.
            BOOTRC_IN_ROOT=$(find "out/target/product/${DEVICE}" \
              -path '*recovery/root/system/etc/init/android.hardware.boot@1.2-service.rc' -print -quit 2>/dev/null)
            if [ -z "${BOOTRC_IN_ROOT}" ]; then
              echo "::error::boot HAL .rc override is missing from the staged recovery root; the shim would never be preloaded"
              FAIL=1
            elif ! grep -q 'setenv LD_PRELOAD /sbin/libaera_boot_trim.so' "${BOOTRC_IN_ROOT}"; then
              echo "::error::boot HAL .rc does not setenv LD_PRELOAD /sbin/libaera_boot_trim.so"
              grep -n -A10 'service boot-hal-1-2' "${BOOTRC_IN_ROOT}" || true
              FAIL=1
            else
              echo "boot HAL preload staged: ${BOOTRC_IN_ROOT}"
            fi

            # Same reasoning for the VINTF manifest. The MTK boot HAL registers
            # both 1.0 and 1.2, and hwservicemanager refuses any fqname the
            # device manifest does not declare. Without @1.2 the HAL is rejected,
            # exits, and recovery blocks forever in IBootControl::getService().
            MANIFEST_IN_ROOT=$(find "out/target/product/${DEVICE}" \
              -path '*recovery/root/vendor/etc/vintf/manifest.xml' -print -quit 2>/dev/null)
            if [ -z "${MANIFEST_IN_ROOT}" ]; then
              echo "::error::vendor VINTF manifest is missing from the staged recovery root"
              FAIL=1
            elif ! grep -q '@1.2::IBootControl/default' "${MANIFEST_IN_ROOT}"; then
              echo "::error::staged vendor manifest does not declare @1.2::IBootControl/default; the boot HAL would be refused and recovery would block"
              grep -n -A8 'android.hardware.boot' "${MANIFEST_IN_ROOT}" || true
              FAIL=1
            else
              echo "manifest declares boot@1.2: ${MANIFEST_IN_ROOT}"
              grep -n 'IBootControl/default' "${MANIFEST_IN_ROOT}" || true
            fi

            # The Mali staging/probe scripts live in the recovery overlay and
            # must reach the ramdisk executable. A silently missing or
            # non-executable script means the GPU path can never be tested.
            for script in selene-gpu-launch.sh selene-gpu-test.sh selene-gpu-libraries.sh; do
              STAGED=$(find "out/target/product/${DEVICE}" \
                -path "*recovery/root/system/bin/${script}" -print -quit 2>/dev/null)
              if [ -z "${STAGED}" ]; then
                echo "::error::${script} is missing from the staged recovery root"
                FAIL=1
              elif [ ! -x "${STAGED}" ]; then
                echo "::error::${script} is not executable in the staged recovery root"
                FAIL=1
              else
                echo "gpu script staged: ${STAGED}"
              fi
            done
          fi

          df -h .
          free -h
          if command -v ccache >/dev/null 2>&1; then
            echo "=== ccache statistics ==="
            ccache -s || true
            du -sh "${CCACHE_DIR}" 2>/dev/null || true
          fi
          # All assertions have run by now; fail the step once, at the end, so a
          # single run reports every problem instead of the first one.
          if [ "${FAIL:-0}" -ne 0 ]; then
            echo "::error::build assertions failed; see the errors above"
            rc=1
          fi
          exit "$rc"

      # Saved on every run, hit or miss. The old condition skipped the save
      # whenever a cache was restored, which is the bug that kept the compiler
      # cache at zero: each run restored whatever existed, compiled with it, and
      # threw its own results away. The key carries the run id, so every save is
      # a distinct entry and the restore-key prefix picks the newest; GitHub
      # evicts the oldest once the repository passes 10 GB, which is now the
      # intended behaviour rather than a collision with the source cache.
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: aera-ccache-${{ env.MANIFEST_BRANCH }}-${{ github.run_id }}

      # There used to be a "Queue the next build" step here. It could only fire
      # on a budget stop, and the budget is gone; more to the point, the failure
      # it existed to cover -- a hosted runner dying mid-build -- runs no steps
      # at all, so it could never have fired for that case either. Retries are
      # owned by the `schedule:` trigger and the `gate` job at the top of this
      # file, which GitHub evaluates whether or not a runner is still alive.
      - name: Stop resource telemetry
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkill -f telemetry.py || true
          df -h / || true
          free -h || true
          # If this comment exists, the runner was still alive when Build ended.
          # If the newest telemetry comment has no successor, that timestamp is
          # when the runner stopped answering -- which is the whole point.
          python3 - <<'PY' || true
          import json
          import os
          import urllib.request

          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/commits/%s/comments"
                  % (os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]),
                  data=json.dumps(
                      {
                          "body": "**telemetry stopped** -- the runner was still "
                          "alive when Build ended, so the newest sample above is "
                          "not a death snapshot."
                      }
                  ).encode(),
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "aera-telemetry",
                      "Content-Type": "application/json",
                  },
              )
              urllib.request.urlopen(req, timeout=30).read()
          except Exception as e:
              print("stop comment failed:", e)
          PY

      # ---------------------------------------------------------------------
      # Artifacts
      # ---------------------------------------------------------------------
      - name: Collect images
        if: always()
        run: |
          # An earlier step may have failed before the workdir existed; do not
          # turn that into a second, confusing error.
          cd "${WORKDIR}" 2>/dev/null || { echo "no workdir, nothing to collect"; exit 0; }
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          ls -lh "out/target/product/${DEVICE}/" 2>/dev/null | head -40 || true
          for f in \
            "out/target/product/${DEVICE}/AERA-R"*.img \
            "out/target/product/${DEVICE}/AERA-R"*.zip \
            "out/target/product/${DEVICE}/boot.img" \
            "out/target/product/${DEVICE}/recovery.img" \
            "out/target/product/${DEVICE}/vendor_boot.img"; do
            [ -f "$f" ] && cp -f "$f" "${GITHUB_WORKSPACE}/artifacts/"
          done
          ls -lh "${GITHUB_WORKSPACE}/artifacts/" || true

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-selene-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aera-selene-${{ github.run_id }}
          name: AERA Recovery selene ${{ github.run_id }}
          files: ${{ github.workspace }}/artifacts/*
          # Loud failure beats a green run with an empty release -- that is
          # exactly how run #6 wasted a night.
          fail_on_unmatched_files: true
          body: |
            AERA Recovery for the Xiaomi Redmi 10 (selene).

            - Target: `${{ env.BUILD_TARGET }}`
            - Manifest: `aera-16.0`
            - Device tree: `${{ env.DEVICE_BRANCH }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::build failed - see the Build step above"
          cd "${WORKDIR}" 2>/dev/null || exit 0
          df -h . || true
          free -h || true
