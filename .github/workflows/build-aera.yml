name: Build AERA Recovery (selene)

# AERA for the Xiaomi Redmi 10 (selene), compiled on a GitHub-hosted runner.
#
# Runner recipe is the one that actually ships AERA images (AzzyC's
# Action-OFRP-Builder, 14/20 successes at 78-156 min on the same manifest):
#
#   * ubuntu-24.04 -- NOT 22.04. The 24.04 public image comes with a 145 GB
#     root disk. On 22.04 easimon/maximize-build-space pooled us down to 84 GB,
#     i.e. it was actively costing us space. Do not add it back.
#   * slimhub deletes the preinstalled SDKs/CLR/Haskell/CodeQL that this build
#     never touches.
#   * 30 GB of swap is what lets -j$(nproc) survive Soong's peak RSS on a
#     16 GB runner.
#
# The repository MUST be public. A private repo gets a 2 vCPU / 8 GB runner and
# Soong is OOM-killed about 48 minutes in. Every AERA builder repo that produces
# images is public for exactly this reason.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        type: choice
        default: bootimage
        options:
          - bootimage
          - recoveryimage
          - vendorboot
      device_branch:
        description: 'Device tree branch'
        required: false
        default: aera-16.0
      chain:
        description: 'Generation of the auto-chain (0 = start a fresh chain)'
        required: false
        default: '0'
  push:
    branches:
      - aera-16.0
    paths:
      - 'device/**'
      # The gralloc1 shim has its own minute-long workflow
      # (.github/workflows/gralloc1-shim.yml). It is staged into the blob store
      # on the rescue partition and loaded through ro.aera.gpu.gralloc, so it is
      # not part of the ramdisk: an image build only re-validates it. Editing it
      # alone must not cost two and a half hours.
      - '!device/xiaomi/selene/gralloc1_compat/**'
      # A patch to a synced project only takes effect in an image build.
      - 'patches/**'
      - '.github/workflows/build-aera.yml'

concurrency:
  group: aera-selene
  cancel-in-progress: false

permissions:
  contents: write
  # Re-dispatching this workflow is the exception to "events created by
  # GITHUB_TOKEN do not start runs": workflow_dispatch is explicitly allowed.
  actions: write

jobs:
  build:
    name: Build AERA for selene
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      AERA_MANIFEST: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: aera-16.0
      DEVICE: selene
      DEVICE_PATH: device/xiaomi/selene
      LUNCH: twrp_selene-bp2a-eng
      BUILD_TARGET: ${{ github.event.inputs.target || 'bootimage' }}
      DEVICE_BRANCH: ${{ github.event.inputs.device_branch || 'aera-16.0' }}
      WORKDIR: ${{ github.workspace }}/aera
      # Compiler cache. AzzyC's builder -- the recipe this workflow is based on
      # -- measured the same manifest at 2h06m for the build step without it and
      # 1h28m with it, which is 38 minutes for ~4 GB of cache. That is worth
      # more than any tuning of -j, because it removes work instead of
      # redistributing it.
      #
      # USE_CCACHE/CCACHE_EXEC are the pair soong looks for; CCACHE_DIR has to
      # live under github.workspace or the cache action cannot see it.
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content

    steps:
      # ---------------------------------------------------------------------
      # Space / RAM
      # ---------------------------------------------------------------------
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      # slimhub frees the preinstalled toolchains, which is where the ~110 GB of
      # free space at the start comes from. The swap file is carved out of that
      # same disk, so its size is not free: a 30 GB file plus the ~35 GB source
      # tree plus a full out/ is what the build has to fit in.
      #
      # It is back to 30 GB because that is the only configuration that has ever
      # produced a green image on this runner (run #7). The 8 GB experiment was
      # a guess that the vanishing runner was a full disk; there is no evidence
      # for that, and it made the soong analysis peak worse: run 43835500987 was
      # killed at 14.9 GB RSS with swap 5.7/8 GB used, five minutes into Build.
      # Disk is now sampled every 30 s, so the disk theory can be settled with
      # data instead of by starving the memory peak.
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 30

      - name: Show resources
        run: |
          echo "cores: $(nproc)"
          df -h /
          free -h

      # ---------------------------------------------------------------------
      # Toolchain
      # ---------------------------------------------------------------------
      # OrangeFox's android_build_env.sh is the de-facto standard, but on noble
      # it is effectively a no-op (it only pulls software-properties-common) --
      # the ubuntu-24.04 image already carries most of the Android toolchain.
      # The extras below are therefore filtered by availability: Ubuntu 24.04
      # dropped the 22.04-era names (libncurses5, lib32ncurses5-dev do not
      # exist on noble) and one unknown name aborts the whole apt transaction.
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y

          if curl -fsSL -o /tmp/android_build_env.sh \
               "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"; then
            sudo bash /tmp/android_build_env.sh || true
          fi

          WANTED="git-core gnupg flex bison build-essential zip curl zlib1g-dev \
                  libc6-dev-i386 libncurses-dev lib32ncurses-dev libncurses5 \
                  lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
                  libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
                  python3 python-is-python3 rsync lz4 bc ccache imagemagick libssl-dev \
                  cpio xz-utils"
          AVAILABLE=""
          for pkg in $WANTED; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              AVAILABLE="$AVAILABLE $pkg"
            else
              echo "skipping (not packaged here): $pkg"
            fi
          done
          sudo apt-get install -y $AVAILABLE

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          repo --version

          git config --global user.name "AERA Builder"
          git config --global user.email "builder@github.local"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      # ---------------------------------------------------------------------
      # Compiler cache
      # ---------------------------------------------------------------------
      # A rolling key with a prefix restore-key: the exact key never matches, so
      # every run restores the newest ccache that exists and then saves its own.
      # That is deliberate -- a static key (what AzzyC's workflow uses) freezes
      # the cache at the first successful save and stops improving, and this
      # build is going to need several attempts before one survives.
      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: aera-ccache-${{ env.MANIFEST_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            aera-ccache-${{ env.MANIFEST_BRANCH }}-

      # ---------------------------------------------------------------------
      # Source
      # ---------------------------------------------------------------------
      # The AERA manifest is ~1000 projects. Sync is the fragile part: a dead
      # remote used to hang forever on a credential prompt, and a killed
      # attempt leaves packfiles behind, so the resume loop can itself bloat
      # .repo. Hence: fail fast on prompts, a 45 minute cap per attempt, a
      # heartbeat so the runner never goes silent for an hour, and a free
      # space guard that fails loudly instead of burning half an hour.
      #
      # The .repo cache is worth ~12 minutes per attempt. Measured on
      # ILYESwsa's F11 workflow (same manifest, same runner class):
      #   restore 18.8 GB cache   3m39s
      #   repo sync after restore  3m46s
      #   total                     ~7m30s   (vs ~20m cold)
      # It is an 18.8 GB entry, well over the 10 GB free-tier figure -- it
      # restores fine in practice, so do not "fix" it by trimming the path.
      - name: Restore source cache
        id: synccache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: aera/.repo
          key: aera-sync-${{ env.MANIFEST_BRANCH }}-v1

      - name: Sync AERA sources
        run: |
          mkdir -p "${WORKDIR}"
          cd "${WORKDIR}"

          repo init --depth=1 -u "${AERA_MANIFEST}" -b "${MANIFEST_BRANCH}"
          find .repo/manifests -name '*.xml' -exec sed -i 's|ssh://git@github.com/|https://github.com/|g' {} + || true

          export GIT_TERMINAL_PROMPT=0
          OK=0
          for attempt in 1 2 3; do
            FREE_GB=$(df --output=avail -BG . | tail -1 | tr -dc '0-9')
            echo "--- sync attempt ${attempt}: ${FREE_GB}G free"
            if [ "${FREE_GB}" -lt 15 ]; then
              echo "ERROR: only ${FREE_GB}G free at attempt start"
              exit 1
            fi

            ( while true; do
                sleep 60
                echo "[heartbeat] .repo=$(du -sh .repo 2>/dev/null | cut -f1) free=$(df -h . | tail -1 | awk '{print $4}')"
              done ) &
            HB=$!

            # -j16 rather than -j4: this sync is network-bound (989 small
            # clones), not CPU-bound, so the core count is the wrong limit.
            # On a warm cache the objects are already in .repo/projects, so
            # this mostly just materialises the working tree.
            if timeout 2700 repo sync -c --no-clone-bundle --no-tags --prune -j16 --verbose; then
              kill "$HB" 2>/dev/null || true
              OK=1
              break
            fi
            kill "$HB" 2>/dev/null || true
            echo "attempt ${attempt} incomplete, resuming in 15s"
            sleep 15
          done

          if [ "$OK" != "1" ] || [ ! -f build/envsetup.sh ]; then
            echo "ERROR: source sync did not complete"
            df -h .
            exit 1
          fi
          echo "sync complete: $(du -sh . | cut -f1)"

      # Save before Drop .repo deletes the thing being cached. continue-on-error
      # so a cache failure can never fail a build that is otherwise fine.
      - name: Save source cache
        if: steps.synccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: aera/.repo
          key: aera-sync-${{ env.MANIFEST_BRANCH }}-v1

      # ---------------------------------------------------------------------
      # Mali GPU backend
      # ---------------------------------------------------------------------
      # apkreader's mali-testing branch adds the stock-driver Mali backend on
      # top of exactly the recovery commit this manifest pins (e438f6d) and the
      # LVGL base (6267941). Switch the checkout and apply the four LVGL
      # patches; --check verifies the sequence before touching anything.
      - name: Apply Mali GPU backend
        run: |
          cd "${WORKDIR}"
          git -C bootable/recovery fetch --depth=1 \
            https://github.com/apkreader/android_bootable_recovery.git mali-testing
          git -C bootable/recovery switch --detach FETCH_HEAD
          test -f bootable/recovery/aeraui/core/mali_display.cpp \
            || { echo "::error::mali_display.cpp is missing after the branch switch"; exit 1; }
          grep -q 'core/mali_display.cpp' bootable/recovery/aeraui/Android.bp \
            || { echo "::error::aeraui/Android.bp does not list mali_display.cpp"; exit 1; }
          python3 bootable/recovery/aeraui/tools/prepare-mali-lvgl.py --check
          python3 bootable/recovery/aeraui/tools/prepare-mali-lvgl.py
          echo "mali backend: $(git -C bootable/recovery rev-parse --short HEAD)"
          echo "lvgl:         $(git -C external/lvgl rev-parse --short HEAD)"

      - name: Add the device tree
        run: |
          cd "${WORKDIR}"
          git clone --depth=1 "https://github.com/${{ github.repository }}.git" -b "${DEVICE_BRANCH}" /tmp/dt
          mkdir -p device/xiaomi
          rm -rf "${DEVICE_PATH}"
          cp -a "/tmp/dt/${DEVICE_PATH}" "${DEVICE_PATH}"
          chmod +x "${DEVICE_PATH}/vendorsetup.sh" 2>/dev/null || true
          echo "device tree files: $(find "${DEVICE_PATH}" -type f | wc -l)"

      # ---------------------------------------------------------------------
      # Local patches to synced projects
      # ---------------------------------------------------------------------
      # The Mali backend comes from apkreader's mali-testing branch, which is not
      # ours to push to, and the fixes it needs are small and specific. They live
      # in patches/<project path>/NNNN-*.patch in this repo and are applied here,
      # after the branch switch above.
      #
      # `git apply --check` runs first for every patch: a context mismatch has to
      # fail the build in the first two minutes, not after two and a half hours
      # with an image that silently lacks the fix.
      - name: Apply local patches
        run: |
          cd "${WORKDIR}"
          root="${GITHUB_WORKSPACE}/patches"
          shopt -s globstar nullglob
          count=0
          for patch in "$root"/**/*.patch; do
            project="${patch#"$root"/}"
            project="${project%/*}"
            echo "applying $(basename "$patch") to ${project}"
            if ! git -C "${project}" apply --check "${patch}"; then
              echo "::error::$(basename "$patch") does not apply to ${project} (upstream context changed)"
              exit 1
            fi
            git -C "${project}" apply "${patch}"
            count=$((count + 1))
          done
          echo "patches applied: ${count}"
          git -C bootable/recovery --no-pager log --oneline -1
          git -C bootable/recovery --no-pager diff --stat

      # .repo holds the full git history of ~1000 projects. It is worthless
      # once the working tree exists, and dropping it reclaims ~18 GB right
      # before the step that needs the space.
      - name: Drop .repo
        run: |
          cd "${WORKDIR}"
          df -h .
          echo "removing .repo"
          rm -rf .repo
          df -h .

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------
      # GOGC/GOMEMLIMIT/GOMAXPROCS keep Soong's Go heap inside the runner's
      # RAM. Measured on this exact runner class (16 GB) by ILYESwsa's F11
      # workflow: soong_build was OOM-killed at ~13.6 GB RSS.
      #
      # 11 GiB plus 30 GB of swap is the combination that has actually produced
      # a green image here (run #7), so it is what this uses. It is a soft
      # limit and the analysis genuinely needs ~14 GB, so the limit is not what
      # keeps it alive -- the swap is.
      #
      # 6 GiB was tried and is not what failed (the deaths did not move), but it
      # only makes the GC burn CPU it cannot save: at 14 GB live there is
      # nothing to collect. Do not lower it again expecting a memory win.
      - name: Build
        env:
          GOGC: "40"
          GOMEMLIMIT: "11GiB"
          GOMAXPROCS: "2"
          ALLOW_MISSING_DEPENDENCIES: "true"
          # Raise this once the wall is understood; 1500 s is chosen to end the
          # step well before the ~47 minute point where the runner dies.
          BUILD_BUDGET_SEC: "1500"
          # The sampler inside this step posts commit comments, and the token
          # is not exported automatically -- it has to be named here or the
          # sampler dies on KeyError at startup and we are blind again.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${WORKDIR}"

          # Compiler cache. Soong only uses ccache when USE_CCACHE and
          # CCACHE_EXEC are both set in the build's own environment, and -z
          # zeroes the counters so the stats at the end of this step describe
          # this run instead of the history of the restored cache.
          if command -v ccache >/dev/null 2>&1; then
            export USE_CCACHE=1
            export CCACHE_EXEC="$(command -v ccache)"
            mkdir -p "${CCACHE_DIR}"
            ccache -M "${CCACHE_MAXSIZE}" >/dev/null 2>&1 || true
            ccache -z >/dev/null 2>&1 || true
            echo "ccache: ${CCACHE_EXEC} max ${CCACHE_MAXSIZE} dir ${CCACHE_DIR}"
            du -sh "${CCACHE_DIR}" 2>/dev/null || true
          else
            echo "::warning::ccache is not installed; building without a compiler cache"
            unset USE_CCACHE CCACHE_EXEC
          fi

          # -------------------------------------------------------------------
          # Instruments, started here on purpose
          # -------------------------------------------------------------------
          # A background process started in an earlier step gets reaped when
          # that step ends: the first sampler posted at t+0 and t+91s and then
          # went silent for the remaining 46 minutes of the job. Starting them
          # inside the step they watch is what makes them live long enough to
          # be useful.
          #
          # Everything here is posted as a commit comment, which lives on
          # GitHub rather than on the runner. A runner that dies uploads no log
          # (the blob is 404), so the last comment is the only record of the
          # state at the moment it stopped answering.
          cat > /tmp/telemetry.py <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request

          TOKEN = os.environ["GITHUB_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          SHA = os.environ["GITHUB_SHA"]
          WORKDIR = os.environ.get("WORKDIR", ".")
          API = "https://api.github.com"


          def post(text):
              req = urllib.request.Request(
                  API + "/repos/%s/commits/%s/comments" % (REPO, SHA),
                  data=json.dumps({"body": text}).encode(),
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "aera-telemetry",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode() or "{}")


          def sh(cmd, limit=20):
              # `timeout` goes INSIDE the command. subprocess.run's own timeout
              # kills only bash; a grandchild holding the pipe then makes the
              # follow-up communicate() block forever, which is how the previous
              # sampler went silent at t+155s while the job lived on.
              try:
                  p = subprocess.run(
                      ["bash", "-lc", "timeout %d %s" % (limit, cmd)],
                      capture_output=True,
                      text=True,
                      timeout=limit + 10,
                  )
                  return (p.stdout or p.stderr).strip().replace("\n", " ")
              except Exception as e:
                  return "err:%s" % type(e).__name__


          def meminfo():
              d = {}
              with open("/proc/meminfo") as fh:
                  for line in fh:
                      k, v = line.split(":", 1)
                      d[k] = int(v.split()[0]) // 1024
              return d


          lines = []
          t0 = time.time()
          n = 0
          out = "?"
          while True:
              el = int(time.time() - t0)
              # /proc reads: no subprocess, so they still work while the box is
              # thrashing. MemAvailable is the number that actually predicts the
              # OOM killer, and it is not in `free` output.
              m = meminfo()
              mem = "used %d/%d MB avail %d" % (
                  m["MemTotal"] - m["MemAvailable"],
                  m["MemTotal"],
                  m["MemAvailable"],
              )
              swp = "%d/%d MB" % (m["SwapTotal"] - m["SwapFree"], m["SwapTotal"])
              load = " ".join(open("/proc/loadavg").read().split()[:3])
              try:
                  p = open("/proc/pressure/memory").readline().split()
                  psi = "avg10=%s total=%s" % (
                      p[1].split("=")[1],
                      p[4].split("=")[1],
                  )
              except Exception:
                  psi = "?"
              disk = sh("df -h / | tail -1 | awk '{print $3\" used, \"$4\" avail, \"$5}'")
              if n % 2 == 0:
                  out = sh("du -sm '%s/out' 2>/dev/null | cut -f1" % WORKDIR) or "?"
              nclang = sh("pgrep -c clang 2>/dev/null || echo 0")
              top = sh(
                  "ps -eo rss,comm --sort=-rss | sed -n '2,4p' "
                  "| awk '{printf \"%s=%dM \", $2, $1/1024}'"
              )
              lines.append(
                  "t+%5ds | disk %s | out %sM | mem %s | swap %s | load %s "
                  "| psi %s | clang %s | %s"
                  % (el, disk, out, mem, swp, load, psi, nclang, top)
              )
              if n % 5 == 0:
                  # dmesg is the only source that says outright whether the
                  # kernel OOM-killed something, and which process it chose.
                  klog = sh(
                      "sudo -n dmesg -T | tail -6 | tr '\\n' '|' | cut -c1-500",
                      12,
                  )
                  if klog:
                      lines.append("    klog: " + klog)
              lines = lines[-40:]
              n += 1
              try:
                  post(
                      "**build telemetry** #%d pid=%d\n\n```\n%s\n```\n"
                      % (n, os.getpid(), "\n".join(lines))
                  )
              except Exception as e:
                  print("post failed:", e, flush=True)
              time.sleep(30)
          PY
          setsid nohup python3 -u /tmp/telemetry.py > /tmp/telemetry.log 2>&1 &
          sleep 3
          head -3 /tmp/telemetry.log 2>/dev/null || true

          # A runner with a full disk cannot upload its log, so it just
          # vanishes. Killing the build while there is room turns that into an
          # ordinary failure with a log.
          cat > /tmp/diskwatch.sh <<'SH'
          #!/bin/bash
          while true; do
            avail=$(df --output=avail -m / | tail -1 | tr -d ' ')
            if [ "${avail}" -lt 2048 ]; then
              echo "::error::disk nearly full (${avail} MB free) - aborting before the runner dies"
              touch /tmp/diskfull
              df -h /
              du -sh "${WORKDIR}/out" 2>/dev/null | tail -1
              du -sh "${WORKDIR}"/out/* 2>/dev/null | sort -h | tail -10
              pkill -f soong_ui || true
              pkill -f ninja || true
              exit 1
            fi
            sleep 10
          done
          SH
          chmod +x /tmp/diskwatch.sh
          setsid nohup /tmp/diskwatch.sh > /tmp/diskwatch.log 2>&1 &
          echo "watchdog armed: $(df -h / | tail -1 | awk '{print $4}') free"


          # The wiki is explicit: AERA_BUILD_DEVICE must be set in the calling
          # shell *before* envsetup is sourced, otherwise another tree's exports
          # can leak in and the vendorsetup guard never runs for this device.
          export AERA_BUILD_DEVICE="${DEVICE}"
          set +e
          source build/envsetup.sh
          set -e

          # selene's product is twrp_selene (AndroidProducts.mk) and AERA 16
          # uses the bp2a release name, so the combo is twrp_selene-bp2a-eng.
          # The twrp_ prefix is a build product name, not UI branding, and
          # there is no aera_selene product -- earlier fallbacks to
          # "aera_selene-bp2a-eng" / "twrp_selene-eng" only produced
          # "Invalid lunch combo" noise that hid the real error.
          if ! lunch "${LUNCH}"; then
            echo "::error::lunch ${LUNCH} failed -- see the make error above"
            exit 1
          fi

          # Build the boot-HAL ABI shim before the full build. It takes seconds
          # and lets a wrong symbol name fail here instead of 90 minutes later.
          # The shim is staged on the recovery overlay at /sbin: that is rootfs
          # and therefore survives a zip installer mounting the system partition
          # over /system. (A /system path made getprop unexecutable mid-install:
          #   CANNOT LINK EXECUTABLE "getprop": library
          #     "/system/lib64/libaera_boot_trim.so" not found)
          m libaera_boot_trim

          SHIM=$(find "out/target/product/${DEVICE}" -name libaera_boot_trim.so -print -quit)
          if [ -z "${SHIM}" ]; then
            # 'm <module>' may only produce the Soong intermediate; that is
            # still the exact .so we want on the ramdisk.
            SHIM=$(find out/soong/.intermediates -name libaera_boot_trim.so -print -quit 2>/dev/null)
          fi
          if [ -z "${SHIM}" ]; then
            echo "::error::libaera_boot_trim.so was not produced by 'm libaera_boot_trim'"
            exit 1
          fi
          echo "shim built: ${SHIM}"
          if ! readelf -sW "${SHIM}" | grep -q '_ZN7android4base4TrimERKNSt3__112basic_stringIcNS1_11char_traitsIcEENS1_9allocatorIcEEEE'; then
            echo "::error::libaera_boot_trim.so does not export android::base::Trim(std::string const&)"
            readelf -sW "${SHIM}" | grep -i trim || true
            exit 1
          fi
          mkdir -p "${DEVICE_PATH}/recovery/root/sbin"
          cp -f "${SHIM}" "${DEVICE_PATH}/recovery/root/sbin/"
          ls -l "${DEVICE_PATH}/recovery/root/sbin/libaera_boot_trim.so"

          # The gralloc1 shim is in PRODUCT_PACKAGES, so `mka` builds it as
          # part of the image; a separate `m libaera_gralloc1` here would cost a
          # second full soong analysis (a ~9 GB, several-minute step) for a
          # module the build already produces. Its assertions moved to after
          # the build, where the artefact actually exists.
          set +e
          # The runner dies ~47 minutes into this step, five times out of five,
          # and it takes its log and its ccache with it. Ending the step before
          # that point is the only way to finish the job normally -- and a job
          # that finishes normally is the only kind that uploads a log and
          # saves a cache. Soong is invoked directly because `mka` is a shell
          # function and `timeout` cannot exec a function.
          #
          # 1500 s of compilation plus ~9 minutes of soong analysis (two
          # invocations: libaera_boot_trim, then this one) keeps the whole step
          # near 34 minutes, which leaves real margin under the wall.
          BUILD_BUDGET_SEC="${BUILD_BUDGET_SEC:-1500}"
          echo "build budget: ${BUILD_BUDGET_SEC}s"
          # One deadline for the whole step, not one per attempt: the retry
          # below must not be handed a fresh 1500 s, or two attempts would add
          # up to ~59 minutes and walk straight into the wall the budget exists
          # to stay under.
          DEADLINE=$(( $(date +%s) + BUILD_BUDGET_SEC ))
          build_within_budget() {
            local remain=$(( DEADLINE - $(date +%s) ))
            if [ "${remain}" -lt 60 ]; then remain=60; fi
            echo "--- building (${remain}s of budget left): $*"
            timeout --signal=INT --kill-after=120 "${remain}" \
              build/soong/soong_ui.bash --make-mode "$@"
          }
          build_within_budget adbd "${BUILD_TARGET}"
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 130 ]; then
            touch /tmp/budget_stop
            echo "::warning::stopped by the ${BUILD_BUDGET_SEC}s budget, not by an error"
            echo "::warning::this run banks its ccache and uploads its log; the next one resumes further along"
          elif [ "$rc" -ne 0 ]; then
            if [ -e /tmp/diskfull ]; then
              # The watchdog already killed this build on purpose. Retrying
              # would either die the same way or spend the budget compiling
              # into a full disk.
              echo "::error::aborted by the disk watchdog; not retrying"
            elif ! ls out/target/product/${DEVICE}/*.img >/dev/null 2>&1; then
              # selene is recovery-as-boot, so bootimage is the normal target.
              # If the boot rule is unavailable on this tree, recoveryimage
              # still produces a flashable image.
              echo "--- ${BUILD_TARGET} failed (rc=$rc), retrying with recoveryimage"
              build_within_budget adbd recoveryimage
              rc=$?
            fi
          fi

          echo "BUILD_RC=$rc"

          # The gralloc1 shim assertions, moved here because the module is now
          # produced by mka rather than by a separate `m` invocation.
          #
          # Only when the build actually finished. A budget stop is a normal
          # outcome of this workflow (see above) and the shim is one module
          # among thousands, so it will not exist yet; treating that as "the
          # shim was not produced" would turn an intentional stop into a
          # misleading hard failure.
          if [ "$rc" -eq 0 ]; then
            GRALLOC=$(find out/soong/.intermediates "out/target/product/${DEVICE}" \
              -name libaera_gralloc1.so -print -quit 2>/dev/null)
            if [ -z "${GRALLOC}" ]; then
              echo "::error::libaera_gralloc1.so was not produced, but device.mk puts it in PRODUCT_PACKAGES"
              exit 1
            fi
            echo "gralloc shim built: ${GRALLOC}"
            if ! readelf -hW "${GRALLOC}" | grep -q 'AArch64'; then
              echo "::error::libaera_gralloc1.so is not an AArch64 object"
              readelf -hW "${GRALLOC}" || true
              exit 1
            fi
            # dlsym(HAL_MODULE_INFO_SYM_AS_STR) is how mali_display.cpp finds
            # the module, so a hidden symbol would make the HAL invisible. Note
            # the name: hardware.h defines HAL_MODULE_INFO_SYM as HMI, and
            # HAL_MODULE_INFO_SYM_AS_STR as "HMI" -- grepping for the macro
            # name matches nothing at all.
            if ! readelf --dyn-syms -W "${GRALLOC}" | grep -qE 'OBJECT +GLOBAL +DEFAULT +[0-9]+ HMI$'; then
              echo "::error::libaera_gralloc1.so does not export HMI (HAL_MODULE_INFO_SYM)"
              readelf --dyn-syms -W "${GRALLOC}" || true
              exit 1
            fi
            # The private namespace is linked to the recovery process for
            # exactly libc/libm/libdl. Any other DT_NEEDED would have to be
            # staged into the blob store as well, so fail loudly instead of
            # shipping a shim that cannot resolve.
            if readelf -dW "${GRALLOC}" | grep NEEDED | grep -Ev 'libc\.so|libm\.so|libdl\.so'; then
              echo "::error::libaera_gralloc1.so depends on a library the Mali namespace does not share"
              exit 1
            fi
            mkdir -p "${GITHUB_WORKSPACE}/artifacts"
            cp -f "${GRALLOC}" "${GITHUB_WORKSPACE}/artifacts/gralloc.mt6768.so"
            ls -l "${GITHUB_WORKSPACE}/artifacts/gralloc.mt6768.so"
          else
            echo "::notice::build did not finish (rc=${rc}); skipping the gralloc1 shim assertions"
          fi


          # A green build that silently omits the shim would send a still-broken
          # image to the phone, so verify the staged recovery root -- that is
          # exactly what gets packed into the ramdisk.
          if [ "$rc" -eq 0 ]; then
            SHIM_IN_ROOT=$(find "out/target/product/${DEVICE}" \
              -path '*recovery/root/sbin/libaera_boot_trim.so' -print -quit 2>/dev/null)
            if [ -z "${SHIM_IN_ROOT}" ]; then
              echo "::error::libaera_boot_trim.so is missing from the staged recovery root; the ramdisk would ship without the boot-HAL shim"
              find "out/target/product/${DEVICE}" -maxdepth 2 -type d 2>/dev/null | head -40 || true
              rc=1
            else
              echo "boot-HAL shim staged at: ${SHIM_IN_ROOT}"
              readelf -sW "${SHIM_IN_ROOT}" | grep -i trim || true
            fi

            # The preload must be scoped to the boot HAL and point at /sbin.
            # A global export, or a /system path, breaks zip installers.
            BOOTRC_IN_ROOT=$(find "out/target/product/${DEVICE}" \
              -path '*recovery/root/system/etc/init/android.hardware.boot@1.2-service.rc' -print -quit 2>/dev/null)
            if [ -z "${BOOTRC_IN_ROOT}" ]; then
              echo "::error::boot HAL .rc override is missing from the staged recovery root; the shim would never be preloaded"
              rc=1
            elif ! grep -q 'setenv LD_PRELOAD /sbin/libaera_boot_trim.so' "${BOOTRC_IN_ROOT}"; then
              echo "::error::boot HAL .rc does not setenv LD_PRELOAD /sbin/libaera_boot_trim.so"
              grep -n -A10 'service boot-hal-1-2' "${BOOTRC_IN_ROOT}" || true
              rc=1
            else
              echo "boot HAL preload staged: ${BOOTRC_IN_ROOT}"
            fi

            # Same reasoning for the VINTF manifest. The MTK boot HAL registers
            # both 1.0 and 1.2, and hwservicemanager refuses any fqname the
            # device manifest does not declare. Without @1.2 the HAL is rejected,
            # exits, and recovery blocks forever in IBootControl::getService().
            MANIFEST_IN_ROOT=$(find "out/target/product/${DEVICE}" \
              -path '*recovery/root/vendor/etc/vintf/manifest.xml' -print -quit 2>/dev/null)
            if [ -z "${MANIFEST_IN_ROOT}" ]; then
              echo "::error::vendor VINTF manifest is missing from the staged recovery root"
              rc=1
            elif ! grep -q '@1.2::IBootControl/default' "${MANIFEST_IN_ROOT}"; then
              echo "::error::staged vendor manifest does not declare @1.2::IBootControl/default; the boot HAL would be refused and recovery would block"
              grep -n -A8 'android.hardware.boot' "${MANIFEST_IN_ROOT}" || true
              rc=1
            else
              echo "manifest declares boot@1.2: ${MANIFEST_IN_ROOT}"
              grep -n 'IBootControl/default' "${MANIFEST_IN_ROOT}" || true
            fi

            # The Mali staging/probe scripts live in the recovery overlay and
            # must reach the ramdisk executable. A silently missing or
            # non-executable script means the GPU path can never be tested.
            for script in selene-gpu-launch.sh selene-gpu-test.sh selene-gpu-libraries.sh; do
              STAGED=$(find "out/target/product/${DEVICE}" \
                -path "*recovery/root/system/bin/${script}" -print -quit 2>/dev/null)
              if [ -z "${STAGED}" ]; then
                echo "::error::${script} is missing from the staged recovery root"
                rc=1
              elif [ ! -x "${STAGED}" ]; then
                echo "::error::${script} is not executable in the staged recovery root"
                rc=1
              else
                echo "gpu script staged: ${STAGED}"
              fi
            done
          fi

          df -h .
          free -h
          if command -v ccache >/dev/null 2>&1; then
            echo "=== ccache statistics ==="
            ccache -s || true
            du -sh "${CCACHE_DIR}" 2>/dev/null || true
          fi
          exit "$rc"

      # Saved even when the build fails. ccache is the only thing that makes a
      # failed attempt cheaper than the last one, and the runner only runs steps
      # when it is still alive -- which is exactly the distinction that has been
      # making these failures so expensive.
      - name: Save compiler cache
        if: always() && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: aera-ccache-${{ env.MANIFEST_BRANCH }}-${{ github.run_id }}

      # Budget stops are the normal way this workflow makes progress: each run
      # banks its compiler cache and the next one resumes further along. Doing
      # that by hand needs a laptop on the network, so the run queues its own
      # successor. workflow_dispatch is the one event GITHUB_TOKEN is allowed to
      # trigger, which is why this is a dispatch and not a push.
      - name: Queue the next build
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ github.event.inputs.chain || '0' }}
        run: |
          if [ ! -e /tmp/budget_stop ]; then
            echo "not a budget stop; not queueing a successor"
            exit 0
          fi
          if [ "${CHAIN:-0}" -ge 8 ]; then
            echo "::warning::chain reached generation ${CHAIN}; stopping so it cannot run forever"
            exit 0
          fi
          next=$(( ${CHAIN:-0} + 1 ))
          echo "queueing generation ${next} on ${GITHUB_REF_NAME}"
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-aera.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"chain\":\"${next}\",\"target\":\"${BUILD_TARGET}\",\"device_branch\":\"${DEVICE_BRANCH}\"}}")
          echo "dispatch HTTP ${code}"
          cat /tmp/dispatch.out 2>/dev/null || true
          if [ "${code}" != "204" ]; then
            echo "::error::could not queue the next build (HTTP ${code})"
            exit 1
          fi

      - name: Stop resource telemetry
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkill -f telemetry.py || true
          df -h / || true
          free -h || true
          # If this comment exists, the runner was still alive when Build ended.
          # If the newest telemetry comment has no successor, that timestamp is
          # when the runner stopped answering -- which is the whole point.
          python3 - <<'PY' || true
          import json
          import os
          import urllib.request

          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/commits/%s/comments"
                  % (os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]),
                  data=json.dumps(
                      {
                          "body": "**telemetry stopped** -- the runner was still "
                          "alive when Build ended, so the newest sample above is "
                          "not a death snapshot."
                      }
                  ).encode(),
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "aera-telemetry",
                      "Content-Type": "application/json",
                  },
              )
              urllib.request.urlopen(req, timeout=30).read()
          except Exception as e:
              print("stop comment failed:", e)
          PY

      # ---------------------------------------------------------------------
      # Artifacts
      # ---------------------------------------------------------------------
      - name: Collect images
        if: always()
        run: |
          # An earlier step may have failed before the workdir existed; do not
          # turn that into a second, confusing error.
          cd "${WORKDIR}" 2>/dev/null || { echo "no workdir, nothing to collect"; exit 0; }
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          ls -lh "out/target/product/${DEVICE}/" 2>/dev/null | head -40 || true
          for f in \
            "out/target/product/${DEVICE}/AERA-R"*.img \
            "out/target/product/${DEVICE}/AERA-R"*.zip \
            "out/target/product/${DEVICE}/boot.img" \
            "out/target/product/${DEVICE}/recovery.img" \
            "out/target/product/${DEVICE}/vendor_boot.img"; do
            [ -f "$f" ] && cp -f "$f" "${GITHUB_WORKSPACE}/artifacts/"
          done
          ls -lh "${GITHUB_WORKSPACE}/artifacts/" || true

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-selene-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aera-selene-${{ github.run_id }}
          name: AERA Recovery selene ${{ github.run_id }}
          files: ${{ github.workspace }}/artifacts/*
          # Loud failure beats a green run with an empty release -- that is
          # exactly how run #6 wasted a night.
          fail_on_unmatched_files: true
          body: |
            AERA Recovery for the Xiaomi Redmi 10 (selene).

            - Target: `${{ env.BUILD_TARGET }}`
            - Manifest: `aera-16.0`
            - Device tree: `${{ env.DEVICE_BRANCH }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::build failed - see the Build step above"
          cd "${WORKDIR}" 2>/dev/null || exit 0
          df -h . || true
          free -h || true
